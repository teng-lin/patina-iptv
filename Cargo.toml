[workspace]
resolver = "3"
members = [
    "crates/iptv-core",
    "crates/iptv-nav",
    "crates/iptv-settings",
    "crates/iptv-epg",
    "crates/iptv-providers",
    "crates/iptv-guide",
    "crates/iptv-import",
    "crates/iptv-net",
    "crates/iptv-store-sqlite",
    "crates/iptv-search",
    "crates/iptv-app",
    "crates/iptv-player-mpv",
    "crates/iptv-library",
    "crates/iptv-runtime",
]
# nsh generates its own Cargo workspaces under the app crate.
exclude = ["crates/iptv-app/.nsh"]

[workspace.package]
version = "0.1.1"
edition = "2024"
# The toolchain pinned in rust-toolchain.toml: the only one CI builds and tests.
rust-version = "1.99.1"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
iptv-runtime = { path = "crates/iptv-runtime" }
iptv-library = { path = "crates/iptv-library" }
iptv-player-mpv = { path = "crates/iptv-player-mpv" }
iptv-core = { path = "crates/iptv-core" }
iptv-nav = { path = "crates/iptv-nav" }
iptv-settings = { path = "crates/iptv-settings" }
iptv-epg = { path = "crates/iptv-epg" }
iptv-guide = { path = "crates/iptv-guide" }
iptv-search = { path = "crates/iptv-search" }
# The NSH fork checkout (branch tv-keys, at the commit in nsh.rev); upstream PR planned.
nsh-core = { path = "../nsh/crates/nsh-core" }
# No editor, highlighting, charts or terminal: an IPTV app shows none
# (nsh.json "features" keeps them out of the runners too).
nsh-base = { path = "../nsh/crates/nsh-base", default-features = false }
nsh-platform-windows = { path = "../nsh/crates/nsh-platform-windows", default-features = false }
nsh-platform-linux = { path = "../nsh/crates/nsh-platform-linux", default-features = false }
# Headless tests of the app (no QuickJS).
nsh-engine = { path = "../nsh/crates/nsh-engine", default-features = false }
nsh-testing = { path = "../nsh/crates/nsh-testing", default-features = false }
nsh-platform-macos = { path = "../nsh/crates/nsh-platform-macos", default-features = false }
nsh-platform-ios = { path = "../nsh/crates/nsh-platform-ios", default-features = false }
env_logger = "0.11"
log = "0.4"
serde_json = "1"
# iptv-providers (sans-IO, wasm-safe)
iptv-providers = { path = "crates/iptv-providers" }
url = "2.5"
percent-encoding = "2.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha1_smol = "1"
# Import pipeline (core, wasm-safe) and its native network adapter
iptv-import = { path = "crates/iptv-import" }
iptv-net = { path = "crates/iptv-net" }
# iptv-store-sqlite (native adapter; bundled SQLite builds for Android via the NDK)
iptv-store-sqlite = { path = "crates/iptv-store-sqlite" }
rusqlite = { version = "0.42", default-features = false, features = ["bundled-sqlcipher", "cache"] }
tempfile = "3"

# Debug info is most of what a test binary links: with full debug info an
# app test binary is ~1 GB, 94 % of it DWARF, mostly the dependencies'
# (GTK, NSH, ...), and the linker holds it all in memory. Other packages
# (crates.io and the NSH checkout) keep line tables only: backtraces
# through them still show file:line, a debugger shows no variables or
# types there. Our own crates keep full debug info.
[profile.dev.package."*"]
debug = "line-tables-only"

# Debug info stays in the object files under target/ (split DWARF, the
# default on macOS) instead of being copied into every binary: the app's
# test binary goes from ~530 to ~175 MB and its link from ~2 to ~1.2 GB.
# Backtraces and gdb/lldb read it from there, so a binary copied off this
# machine (without target/) has symbols but no debug info.
[profile.dev]
split-debuginfo = "unpacked"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
