version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
  # Cargo needs the pinned sibling NSH checkout, unavailable to Dependabot's
  # file fetcher. dependency-candidate.yml prepares a reviewed lockfile artifact.
  - package-ecosystem: gradle
    directory: /hosts/android
    schedule:
      interval: weekly
