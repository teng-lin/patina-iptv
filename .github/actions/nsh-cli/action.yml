name: Pinned NSH CLI
description: Reuse the finished CLI independently of application dependencies
inputs:
  cache:
    description: Restore and save the tool artifact (disabled for release builds)
    default: 'true'
  stage-release:
    description: Stage the executable for immutable publication from a master candidate
    default: 'false'
  prepared:
    description: Retrieve the CLI from this run's Linux tool builder
    default: 'false'
  share:
    description: Share the Linux CLI with the other jobs in this run
    default: 'false'
outputs:
  artifact-ready:
    description: The verified CLI has been staged for jobs in this run
    value: ${{ steps.stage.outcome == 'success' }}
runs:
  using: composite
  steps:
    - name: Identify NSH CLI inputs
      id: identity
      if: (inputs.cache == 'true' || inputs.prepared == 'true' || inputs.share == 'true') && github.workflow != 'Release'
      shell: bash
      run: |
        key=$(python3 tools/ci/nsh-tool-key.py cli)
        [[ "$key" =~ ^[0-9a-f]{64}$ ]] || exit 1
        root=$(cd ../nsh-patina && pwd)
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "path=$root/target/release/nsh" >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      id: prepared-download
      if: inputs.prepared == 'true' && github.workflow != 'Release'
      continue-on-error: true
      with:
        digest-mismatch: error
        name: patina-nsh-cli-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.key }}
        path: '../nsh-patina/target/release'
    - name: Check the prepared CLI
      id: prepared
      if: steps.prepared-download.outcome == 'success'
      continue-on-error: true
      shell: bash
      run: |
        chmod +x ../nsh-patina/target/release/nsh
        ../nsh-patina/target/release/nsh --version
    - name: Restore immutable NSH CLI release
      id: release
      if: inputs.cache == 'true' && steps.prepared.outcome != 'success' && github.workflow != 'Release'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TOOL_PLATFORM: ${{ runner.os }}-${{ runner.arch }}
        TOOL_KEY: ${{ steps.identity.outputs.key }}
        TOOL_PATH: ${{ steps.identity.outputs.path }}
      run: python3 tools/ci/nsh-cli-release.py restore "$TOOL_PLATFORM" "$TOOL_KEY" "$TOOL_PATH"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.cache == 'true' && steps.prepared.outcome != 'success' && github.workflow != 'Release' && steps.release.outputs.restored != 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/master' && (inputs.share == 'true' || inputs.stage-release == 'true'))
      id: cli
      with:
        path: ${{ steps.identity.outputs.path }}
        key: nsh-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.key }}
    - name: Restore the retained macOS tool
      if: inputs.cache == 'true' && steps.prepared.outcome != 'success' && github.workflow != 'Release' && runner.os == 'macOS' && steps.release.outputs.restored != 'true' && steps.cli.outputs.cache-hit != 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/master' && (inputs.share == 'true' || inputs.stage-release == 'true'))
      id: retained
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TOOL_ARTIFACT: patina-nsh-cli-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.key }}
        TOOL_PATH: ${{ steps.identity.outputs.path }}
      run: python3 tools/ci/restore-macos-tool.py "$TOOL_ARTIFACT" "$TOOL_PATH"
    - name: Build NSH CLI
      if: steps.prepared.outcome != 'success' && steps.release.outputs.restored != 'true' && steps.cli.outputs.cache-hit != 'true' && steps.retained.outputs.restored != 'true'
      shell: bash
      # Bootstrap tools are not shipped. Keep their profile identical on all hosts.
      env:
        CARGO_PROFILE_RELEASE_LTO: 'false'
        CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      run: cargo build --release --locked --manifest-path ../nsh-patina/Cargo.toml -p nsh-cli
    - name: Verify the CLI runs on this host
      shell: bash
      run: ../nsh-patina/target/release/nsh --version
    - name: Stage the pinned CLI for publication
      id: stage
      if: >-
        inputs.share == 'true' || (steps.prepared.outcome != 'success' && inputs.stage-release == 'true' && inputs.cache == 'true' &&
        steps.release.outputs.restored != 'true' && github.repository == 'teng-lin/patina-iptv' &&
        github.event_name == 'push' && github.ref == 'refs/heads/master')
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: patina-nsh-cli-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.key }}
        path: ${{ steps.identity.outputs.path }}
        if-no-files-found: error
        retention-days: ${{ inputs.share == 'true' && 7 || 30 }}
        overwrite: true
    # Save now: a later app failure must not discard a successful tool build.
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.cache == 'true' && steps.prepared.outcome != 'success' && github.workflow != 'Release' && github.ref == 'refs/heads/master' && steps.release.outputs.restored != 'true' && steps.cli.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.identity.outputs.path }}
        key: nsh-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.key }}
    - name: Select NSH CLI
      shell: bash
      run: |
        test -x ../nsh-patina/target/release/nsh
        echo "NSH=$(cd ../nsh-patina && pwd)/target/release/nsh" >> "$GITHUB_ENV"
