name: Pinned NSH CLI
description: Reuse the finished CLI independently of application dependencies
inputs:
  cache:
    description: Restore and save the tool artifact (disabled for release builds)
    default: 'true'
runs:
  using: composite
  steps:
    - name: Identify NSH CLI inputs
      id: identity
      if: inputs.cache == 'true'
      shell: bash
      run: |
        key=$(python3 tools/ci/nsh-tool-key.py cli)
        [[ "$key" =~ ^[0-9a-f]{64}$ ]] || exit 1
        root=$(cd ../nsh-patina && pwd)
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "path=$root/target/release/nsh" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.cache == 'true'
      id: cli
      with:
        path: ${{ steps.identity.outputs.path }}
        key: nsh-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.key }}
    - name: Restore the retained macOS tool
      if: inputs.cache == 'true' && runner.os == 'macOS' && steps.cli.outputs.cache-hit != 'true'
      id: retained
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TOOL_ARTIFACT: patina-nsh-cli-${{ runner.arch }}-${{ steps.identity.outputs.key }}
        TOOL_PATH: ${{ steps.identity.outputs.path }}
      run: python3 tools/ci/restore-macos-tool.py "$TOOL_ARTIFACT" "$TOOL_PATH"
    - name: Build NSH CLI
      if: steps.cli.outputs.cache-hit != 'true' && steps.retained.outputs.restored != 'true'
      shell: bash
      # Bootstrap tools are not shipped. Keep their profile identical on all hosts.
      env:
        CARGO_PROFILE_RELEASE_LTO: 'false'
        CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      run: cargo build --release --locked --manifest-path ../nsh-patina/Cargo.toml -p nsh-cli
    - name: Retain the macOS tool independently of the dependency cache
      if: inputs.cache == 'true' && runner.os == 'macOS' && github.ref == 'refs/heads/master' && steps.cli.outputs.cache-hit != 'true' && steps.retained.outputs.restored != 'true'
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: patina-nsh-cli-${{ runner.arch }}-${{ steps.identity.outputs.key }}
        path: ${{ steps.identity.outputs.path }}
        if-no-files-found: error
        retention-days: 30
    # Save now: a later app failure must not discard a successful tool build.
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.cache == 'true' && steps.cli.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.identity.outputs.path }}
        key: nsh-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.key }}
    - name: Select NSH CLI
      shell: bash
      run: |
        test -x ../nsh-patina/target/release/nsh
        echo "NSH=$(cd ../nsh-patina && pwd)/target/release/nsh" >> "$GITHUB_ENV"
