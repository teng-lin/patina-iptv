name: Windows build prerequisites
description: Pinned NSH and Rust for the Windows app
inputs:
  cache:
    description: Enable the Rust dependency cache
    default: 'true'
  profile:
    description: Cache namespace for native tests or the optimized installer
    default: native
  cache-lookup-only:
    description: Save compiled dependencies from a fresh build without restoring them
    default: 'false'
  cache-on-failure:
    description: Preserve compiled dependencies after trusted validation failures
    default: 'false'
runs:
  using: composite
  steps:
    # nsh.rev and rust-toolchain.toml are the only places that name these pins.
    - name: Read the pinned NSH revision and Rust toolchain
      id: pins
      shell: pwsh
      run: |
        $pins = python tools/ci/pins.py
        if ($LASTEXITCODE -ne 0) { throw 'Could not read the NSH or Rust pin.' }
        $pins >> $env:GITHUB_OUTPUT
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: teng-lin/nsh
        ref: ${{ steps.pins.outputs.nsh }}
        path: nsh-source
        persist-credentials: false
    - shell: pwsh
      run: |
        $source = (Resolve-Path -LiteralPath ./nsh-source).Path
        $destination = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'nsh-patina'
        if (Test-Path -LiteralPath $destination) { throw 'NSH destination already exists.' }
        Move-Item -LiteralPath $source -Destination $destination
        'C:\Strawberry\perl\bin' >> $env:GITHUB_PATH
        'C:\Strawberry\c\bin' >> $env:GITHUB_PATH
        'C:\Program Files\NASM' >> $env:GITHUB_PATH
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: ${{ steps.pins.outputs.toolchain }}
        targets: wasm32-unknown-unknown
    - name: Identify the MSVC toolset and Windows SDK
      id: compiler
      if: inputs.cache == 'true'
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Could not find the Visual Studio C++ toolset.' }
        $vc = (Get-Content -Raw "$vs/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt").Trim()
        $kits = Get-ItemPropertyValue 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' KitsRoot10
        $sdk = @(Get-ChildItem "$kits/Include" -Directory |
          Where-Object { Test-Path (Join-Path $_.FullName 'um/Windows.h') } |
          Sort-Object { [version]$_.Name } | Select-Object -ExpandProperty Name)
        if (!$vc -or !$sdk.Count) { throw 'Could not identify the MSVC or Windows SDK version.' }
        $bytes = [Text.Encoding]::UTF8.GetBytes("$vc/$($sdk -join ',')/$env:ImageOS")
        $key = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
        "key=$key" >> $env:GITHUB_OUTPUT
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: inputs.cache == 'true'
      with:
        cache-on-failure: ${{ inputs.cache-on-failure }}
        cache-bin: 'false'
        # Installer previews and unsigned master builds share this build identity.
        add-job-id-key: 'false'
        key: windows-${{ inputs.profile }}-v1-${{ steps.compiler.outputs.key }}-${{ hashFiles('nsh.rev', 'tools/mpv-runtime/runtime.json') }}
        lookup-only: ${{ inputs.cache-lookup-only }}
        # Per-PR copies of these gigabyte-sized caches evict each other.
        # PRs can restore master caches; only master refreshes them.
        save-if: ${{ github.ref == 'refs/heads/master' }}
        workspaces: .
    - name: Install the checksum-pinned guarded player
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./tools/fetch-mpv-windows.ps1
