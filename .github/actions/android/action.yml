name: Android prerequisites
description: Install the Android toolchain and build the pinned NSH CLI
inputs:
  cache:
    description: Enable Gradle and NSH artifact caches in nonsigning builds
    default: 'gradle'
  abi:
    description: Comma-separated Android ABIs (ARM64 and ARMv7 by default, x86_64 for emulators)
    default: 'arm64-v8a,armeabi-v7a'
runs:
  using: composite
  steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: '21'
        cache: ${{ inputs.cache }}
        cache-dependency-path: |
          hosts/android/**/*.gradle.kts
          hosts/android/gradle.properties
          hosts/android/gradle/wrapper/gradle-wrapper.properties
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
    - name: Install Android build tools
      shell: bash
      env:
        ABI: ${{ inputs.abi }}
      run: |
        sdkmanager "platforms;android-35" "build-tools;35.0.1" "ndk;30.0.16248370"
        IFS=, read -ra abis <<< "$ABI"
        for abi in "${abis[@]}"; do
          case "$abi" in
            arm64-v8a) rustup target add aarch64-linux-android ;;
            armeabi-v7a) rustup target add armv7-linux-androideabi ;;
            x86_64) rustup target add x86_64-linux-android ;;
            *) echo "unsupported ABI $abi" >&2; exit 1 ;;
          esac
        done
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
        echo "NSH=$(cd ../nsh && pwd)/target/release/nsh" >> "$GITHUB_ENV"
        echo "NSH_RUNTIME=$(cd ../nsh && pwd)/target" >> "$GITHUB_ENV"
    - uses: ./.github/actions/nsh-cli
      with:
        cache: ${{ inputs.cache != '' && 'true' || 'false' }}
    - name: Identify Android runtime inputs
      id: identity
      if: inputs.cache != ''
      shell: bash
      run: |
        key=$(python3 tools/ci/nsh-tool-key.py android)
        [[ "$key" =~ ^[0-9a-f]{64}$ ]] || exit 1
        root=$(cd ../nsh && pwd)
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "path=$root/target/android/release" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      if: inputs.cache != ''
      id: runtime
      with:
        path: ${{ steps.identity.outputs.path }}
        key: nsh-android-${{ runner.os }}-${{ runner.arch }}-${{ inputs.abi }}-${{ steps.identity.outputs.key }}
    - name: Build pinned Android runtime
      if: steps.runtime.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ../nsh
      env:
        CARGO_PROFILE_RELEASE_LTO: thin
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        ABI: ${{ inputs.abi }}
      run: |
        IFS=, read -ra abis <<< "$ABI"
        args=()
        for abi in "${abis[@]}"; do args+=(--abi "$abi"); done
        cargo run --locked -p xtask -- android --release "${args[@]}"
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      if: inputs.cache != '' && steps.runtime.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.identity.outputs.path }}
        key: nsh-android-${{ runner.os }}-${{ runner.arch }}-${{ inputs.abi }}-${{ steps.identity.outputs.key }}
