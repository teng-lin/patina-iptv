name: Android prerequisites
description: Install the Android toolchain and build the pinned NSH CLI
inputs:
  cache:
    description: Enable Gradle and NSH artifact caches in nonsigning builds
    default: 'gradle'
  abi:
    description: Comma-separated Android ABIs (ARM64 and ARMv7 by default, x86_64 for emulators)
    default: 'arm64-v8a,armeabi-v7a'
  prepared:
    description: Retrieve the runtime from this run's Linux tool builder
    default: 'false'
  share:
    description: Share the CLI and Android runtime with jobs in this run
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: '21'
        cache: ${{ inputs.share != 'true' && github.workflow != 'Release' && inputs.cache || '' }}
        cache-dependency-path: |
          hosts/android/**/*.gradle.kts
          hosts/android/gradle.properties
          hosts/android/gradle/wrapper/gradle-wrapper.properties
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
    - name: Install Android build tools
      shell: bash
      env:
        ABI: ${{ inputs.abi }}
      run: |
        sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.1" "ndk;30.0.16248370"
        IFS=, read -ra abis <<< "$ABI"
        for abi in "${abis[@]}"; do
          case "$abi" in
            arm64-v8a) rustup target add aarch64-linux-android ;;
            armeabi-v7a) rustup target add armv7-linux-androideabi ;;
            x86_64) rustup target add x86_64-linux-android ;;
            *) echo "unsupported ABI $abi" >&2; exit 1 ;;
          esac
        done
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
        echo "NSH=$(cd ../nsh-patina && pwd)/target/release/nsh" >> "$GITHUB_ENV"
        echo "NSH_RUNTIME=$(cd ../nsh-patina && pwd)/target" >> "$GITHUB_ENV"
    - uses: ./.github/actions/nsh-cli
      with:
        cache: ${{ inputs.cache != '' && 'true' || 'false' }}
        prepared: ${{ inputs.prepared }}
        share: ${{ inputs.share }}
    - name: Identify Android runtime inputs
      id: identity
      if: (inputs.cache != '' || inputs.prepared == 'true' || inputs.share == 'true') && github.workflow != 'Release'
      shell: bash
      env:
        ABI: ${{ inputs.abi }}
      run: |
        key=$(python3 tools/ci/nsh-tool-key.py android)
        [[ "$key" =~ ^[0-9a-f]{64}$ ]] || exit 1
        root=$(cd ../nsh-patina && pwd)
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "abis=${ABI//,/-}" >> "$GITHUB_OUTPUT"
        echo "path=$root/target/android/release" >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      id: prepared-download
      if: inputs.prepared == 'true' && github.workflow != 'Release'
      continue-on-error: true
      with:
        digest-mismatch: error
        name: patina-nsh-android-${{ inputs.abi }}-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.key }}
        path: ${{ runner.temp }}/prepared-nsh-runtime
    - name: Install the prepared runtime
      id: prepared
      if: steps.prepared-download.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        RUNTIME_PATH: ${{ steps.identity.outputs.path }}
        ABI: ${{ inputs.abi }}
      run: python3 tools/ci/nsh-android-bundle.py unpack "$RUNTIME_PATH" "$ABI" "$RUNNER_TEMP/prepared-nsh-runtime/runtime.tar.gz"
    - name: Restore the immutable Android runtime releases
      if: inputs.cache != '' && steps.prepared.outcome != 'success' && github.workflow != 'Release'
      id: durable
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUNTIME_KEY: ${{ steps.identity.outputs.key }}
        RUNTIME_PATH: ${{ steps.identity.outputs.path }}
        ABI: ${{ inputs.abi }}
      run: python3 tools/ci/nsh-android-bundle.py fetch "$RUNTIME_PATH" "$ABI" "$RUNTIME_KEY"
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      if: inputs.cache != '' && steps.prepared.outcome != 'success' && github.workflow != 'Release' && steps.durable.outputs.missing != ''
      id: runtime
      with:
        path: ${{ steps.identity.outputs.path }}
        key: nsh-android-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.abis }}-${{ steps.identity.outputs.key }}
    - name: Build pinned Android runtime
      if: steps.prepared.outcome != 'success' && steps.runtime.outputs.cache-hit != 'true' && (inputs.cache == '' || github.workflow == 'Release' || steps.durable.outputs.missing != '')
      shell: bash
      working-directory: ../nsh-patina
      env:
        CARGO_PROFILE_RELEASE_LTO: thin
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        ABI: ${{ steps.durable.outputs.missing || inputs.abi }}
      run: |
        IFS=, read -ra abis <<< "$ABI"
        args=()
        for abi in "${abis[@]}"; do args+=(--abi "$abi"); done
        cargo run --locked -p xtask -- android --release "${args[@]}"
    - name: Stage the requested ABIs for the other jobs
      if: inputs.share == 'true'
      shell: bash
      env:
        RUNTIME_PATH: ${{ steps.identity.outputs.path }}
        ABI: ${{ inputs.abi }}
      run: python3 tools/ci/nsh-android-bundle.py pack "$RUNTIME_PATH" "$ABI" "$RUNNER_TEMP/shared-nsh-runtime"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: inputs.share == 'true' && contains(inputs.abi, 'arm64-v8a')
      with:
        name: patina-nsh-android-arm64-v8a-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.key }}
        path: ${{ runner.temp }}/shared-nsh-runtime/arm64-v8a/runtime.tar.gz
        if-no-files-found: error
        retention-days: 7
        overwrite: true
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: inputs.share == 'true' && contains(inputs.abi, 'armeabi-v7a')
      with:
        name: patina-nsh-android-armeabi-v7a-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.key }}
        path: ${{ runner.temp }}/shared-nsh-runtime/armeabi-v7a/runtime.tar.gz
        if-no-files-found: error
        retention-days: 7
        overwrite: true
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: inputs.share == 'true' && contains(inputs.abi, 'x86_64')
      with:
        name: patina-nsh-android-x86_64-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.key }}
        path: ${{ runner.temp }}/shared-nsh-runtime/x86_64/runtime.tar.gz
        if-no-files-found: error
        retention-days: 7
        overwrite: true
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.cache != '' && steps.prepared.outcome != 'success' && github.workflow != 'Release' && github.ref == 'refs/heads/master' && steps.durable.outputs.missing != '' && steps.runtime.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.identity.outputs.path }}
        key: nsh-android-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.abis }}-${{ steps.identity.outputs.key }}
