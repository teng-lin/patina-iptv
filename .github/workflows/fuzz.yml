name: Fuzz
on:
  workflow_call:
    inputs:
      targets:
        description: JSON array; empty selects every manifest target
        type: string
        default: '[]'
      seconds:
        type: number
        default: 60
      save-corpus:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      targets:
        type: string
        default: '[]'
      seconds:
        type: number
        default: 300
      save-corpus:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read the pinned nightly toolchain
        id: toolchain
        run: echo "nightly=$(bash tools/ci/fuzz-imports.sh --toolchain)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.nightly }}
      - uses: ./.github/actions/cargo-tool
        with:
          name: cargo-fuzz
          version: 0.13.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fuzz-v2-${{ hashFiles('fuzz/Cargo.lock', 'tools/ci/fuzz-imports.sh') }}
          cache-bin: 'false'
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: fuzz
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-all-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-all-
      - name: Fuzz selected synthetic boundaries with one shared dependency build
        env:
          TARGETS: ${{ inputs.targets }}
          SECONDS_PER_TARGET: ${{ inputs.seconds }}
        run: python3 tools/ci/run-fuzz.py
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && inputs.save-corpus && github.ref == 'refs/heads/master' }}
        with:
          path: fuzz/corpus
          key: fuzz-corpus-all-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: fuzz-crashing-inputs
          path: fuzz/artifacts/
          if-no-files-found: ignore
