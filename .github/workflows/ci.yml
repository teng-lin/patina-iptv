name: Tests
on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
# Superseded PR checks need not keep occupying runners. Releases are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tests-pr-{0}', github.event.pull_request.number) || format('tests-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install linters
        if: matrix.os == 'ubuntu-24.04'
        run: |
          pip install ruff --break-system-packages 2>/dev/null || pip install ruff
          sudo curl -sSL https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint -o /usr/local/bin/ktlint
          sudo chmod +x /usr/local/bin/ktlint
      - run: bash tools/check.sh
        env:
          IPTV_REQUIRE_PLAYER_TESTS: '1'
          IPTV_TEST_WAIT_SCALE: ${{ matrix.os == 'macos-15' && '2' || '1' }}
