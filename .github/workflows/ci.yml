name: Tests
on:
  workflow_call:
    inputs:
      helpers-checked:
        type: boolean
        default: false
      credentials:
        type: boolean
        default: false
      ios:
        type: boolean
        default: false
      tier:
        type: string
        default: full
    outputs:
      credentials-verified:
        description: The Linux production credential check succeeded
        value: ${{ jobs.test.outputs.credentials-verified }}
      ios-verified:
        description: Both iOS targets and the simulator entitlements were checked
        value: ${{ jobs.test.outputs.ios-verified }}
  workflow_dispatch:
    inputs:
      tier:
        type: choice
        default: full
        options: [full, pr]
      app-test-jobs:
        description: Rust test threads and simultaneous Linux app scenarios
        type: choice
        default: '6'
        options: ['4', '6', '8']

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tests-pr-{0}', github.event.pull_request.number) || format('tests-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  test:
    name: host-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    outputs:
      # Each check emits evidence on its own platform. Empty outputs are omitted.
      credentials-verified: ${{ steps.credentials.outputs.verified }}
      ios-verified: ${{ steps.ios.outputs.verified }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        timeout-minutes: 25
        with:
          cache-on-failure: 'true'
          apt-packages: xvfb libgl1-mesa-dri ${{ matrix.os == 'ubuntu-24.04' && inputs.credentials && 'gnome-keyring dbus-x11 libglib2.0-bin' || '' }}
          extra-workspaces: ${{ matrix.os == 'ubuntu-24.04' && 'hosts/tizen-nsh' || '' }}
      - name: Install linters
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 -m venv "$RUNNER_TEMP/linters"
          "$RUNNER_TEMP/linters/bin/pip" install ruff==0.11.13 shellcheck-py==0.10.0.1
          curl --fail --location --retry 3 https://github.com/ktlint/ktlint/releases/download/1.3.1/ktlint \
            -o "$RUNNER_TEMP/linters/bin/ktlint"
          echo "a9f923be58fbd32670a17f0b729b1df804af882fa57402165741cb26e5440ca1  $RUNNER_TEMP/linters/bin/ktlint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/linters/bin/ktlint"
          echo "$RUNNER_TEMP/linters/bin" >> "$GITHUB_PATH"
      - name: Prepare performance report and base policy
        if: matrix.os == 'ubuntu-24.04'
        env:
          PERF_EVENT: ${{ github.event_name }}
          PERF_REF: ${{ github.ref }}
          PERF_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python3 tools/performance/base-policy.py
      - name: Validate the host tier
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            mkdir -p "$RUNNER_TEMP/patina-app-timings"
            export IPTV_RS_TEST_TIMINGS="$RUNNER_TEMP/patina-app-timings"
            bash tools/check.sh "${{ inputs.tier == 'pr' && 'pr' || 'full' }}"
          else
            python3 tools/ci/check-plan.py run --host macos --tier "${{ inputs.tier == 'pr' && 'native' || 'full' }}"
          fi
        env:
          IPTV_HELPERS_CHECKED: ${{ inputs.helpers-checked }}
          IPTV_REQUIRE_PLAYER_TESTS: '1'
          IPTV_TEST_WAIT_SCALE: ${{ matrix.os == 'macos-15' && '2' || '1' }}
          IPTV_REQUIRE_LINTERS: ${{ matrix.os == 'ubuntu-24.04' && '1' || '0' }}
          IPTV_CI_HARNESSES: ${{ matrix.os == 'ubuntu-24.04' && format('{0}/patina-harnesses.json', runner.temp) || '' }}
          IPTV_RS_TEST_JOBS: ${{ inputs.app-test-jobs || '6' }}
          IPTV_CI_TEST_THREADS: ${{ matrix.os == 'ubuntu-24.04' && inputs.app-test-jobs || '' }}
      - name: Reproducible performance journeys
        if: matrix.os == 'ubuntu-24.04'
        run: python3 tools/performance/journeys.py run --harness-manifest "$RUNNER_TEMP/patina-harnesses.json"
      - name: Verify production key creation and reopen with disposable credentials
        id: credentials
        if: matrix.os == 'ubuntu-24.04' && inputs.credentials
        run: |
          python3 tools/ci/isolated-credentials.py
          echo 'verified=true' >> "$GITHUB_OUTPUT"
      - name: Compile iOS device and simulator adapters and check simulator entitlements
        id: ios
        if: matrix.os == 'macos-15' && inputs.ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unset LIBRARY_PATH LD_LIBRARY_PATH DYLD_LIBRARY_PATH IPTV_RS_MPV_LIB_DIR
          bash tools/ci/check-ios.sh
          echo 'verified=true' >> "$GITHUB_OUTPUT"
      - name: Performance report
        if: always() && matrix.os == 'ubuntu-24.04'
        run: |
          cat target/performance/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.os == 'ubuntu-24.04'
        with:
          name: performance-linux
          path: target/performance/summary.json
          if-no-files-found: error
      - name: Rust compilation and linking timings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rust-timings-${{ matrix.os }}
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7
      - name: App scenario timings
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-scenario-timings-linux
          path: ${{ runner.temp }}/patina-app-timings/*.txt
          if-no-files-found: ignore
          retention-days: 7
