name: Tests
on:
  workflow_call:
    inputs:
      tier:
        type: string
        default: full
  workflow_dispatch:
    inputs:
      tier:
        type: choice
        default: full
        options: [full, pr]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tests-pr-{0}', github.event.pull_request.number) || format('tests-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  test:
    name: host-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-on-failure: 'true'
      - name: Install linters
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 -m venv "$RUNNER_TEMP/linters"
          "$RUNNER_TEMP/linters/bin/pip" install ruff==0.11.13 shellcheck-py==0.10.0.1
          curl --fail --location --retry 3 https://github.com/ktlint/ktlint/releases/download/1.3.1/ktlint \
            -o "$RUNNER_TEMP/linters/bin/ktlint"
          echo "a9f923be58fbd32670a17f0b729b1df804af882fa57402165741cb26e5440ca1  $RUNNER_TEMP/linters/bin/ktlint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/linters/bin/ktlint"
          echo "$RUNNER_TEMP/linters/bin" >> "$GITHUB_PATH"
      - name: Prepare performance report and base policy
        if: matrix.os == 'ubuntu-24.04'
        env:
          PERF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p target/performance
          echo '{"schema":1,"valid":false,"errors":["base policy or validation did not complete"]}' > target/performance/summary.json
          python3 tools/performance/test_journeys.py
          base="$PERF_BASE"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then base=$(git rev-parse HEAD^); fi
          git cat-file -e "$base^{commit}"
          if git cat-file -e "$base:tools/performance/baseline.json" 2>/dev/null; then
            git show "$base:tools/performance/baseline.json" > "$RUNNER_TEMP/performance-base.json"
            git show "$base:tools/performance/fixtures.json" > "$RUNNER_TEMP/performance-base-fixtures.json"
            git show "$base:tools/performance/journeys.py" > "$RUNNER_TEMP/performance-base-policy.py"
            python3 "$RUNNER_TEMP/performance-base-policy.py" policy "$RUNNER_TEMP/performance-base.json" \
              --candidate tools/performance/baseline.json --records tools/performance/changes.json \
              --base-fixtures "$RUNNER_TEMP/performance-base-fixtures.json" \
              --candidate-fixtures tools/performance/fixtures.json --report target/performance/summary.json
          else
            echo 'Initial performance policy: the base revision has no baseline.'
          fi
          echo '{"schema":1,"valid":false,"errors":["base policy passed; journeys not run because prior validation did not complete"]}' > target/performance/summary.json
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Validate the host tier
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            bash tools/check.sh "${{ inputs.tier == 'pr' && 'pr' || 'full' }}"
          else
            python3 tools/ci/check-plan.py run --host macos --tier "${{ inputs.tier == 'pr' && 'native' || 'full' }}"
          fi
        env:
          IPTV_REQUIRE_PLAYER_TESTS: '1'
          IPTV_TEST_WAIT_SCALE: ${{ matrix.os == 'macos-15' && '2' || '1' }}
          IPTV_REQUIRE_LINTERS: ${{ matrix.os == 'ubuntu-24.04' && '1' || '0' }}
      - name: Reproducible performance journeys
        if: matrix.os == 'ubuntu-24.04'
        run: python3 tools/performance/journeys.py run
      - name: Performance report
        if: always() && matrix.os == 'ubuntu-24.04'
        run: |
          cat target/performance/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.os == 'ubuntu-24.04'
        with:
          name: performance-linux
          path: target/performance/summary.json
          if-no-files-found: error
      - name: Rust compilation and linking timings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rust-timings-${{ matrix.os }}
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7
