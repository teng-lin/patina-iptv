name: Tests
on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
# Superseded PR checks need not keep occupying runners. Releases are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tests-pr-{0}', github.event.pull_request.number) || format('tests-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install linters
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 -m venv "$RUNNER_TEMP/linters"
          "$RUNNER_TEMP/linters/bin/pip" install ruff==0.11.13 shellcheck-py==0.10.0.1
          curl --fail --location --retry 3 https://github.com/ktlint/ktlint/releases/download/1.3.1/ktlint \
            -o "$RUNNER_TEMP/linters/bin/ktlint"
          echo "a9f923be58fbd32670a17f0b729b1df804af882fa57402165741cb26e5440ca1  $RUNNER_TEMP/linters/bin/ktlint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/linters/bin/ktlint"
          echo "$RUNNER_TEMP/linters/bin" >> "$GITHUB_PATH"
      - run: bash tools/check.sh
        env:
          IPTV_REQUIRE_PLAYER_TESTS: '1'
          IPTV_TEST_WAIT_SCALE: ${{ matrix.os == 'macos-15' && '2' || '1' }}
          IPTV_REQUIRE_LINTERS: ${{ matrix.os == 'ubuntu-24.04' && '1' || '0' }}
