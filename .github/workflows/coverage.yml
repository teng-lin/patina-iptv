name: Coverage
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('coverage-pr-{0}', github.event.pull_request.number) || format('coverage-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IPTV_REQUIRE_PLAYER_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-on-failure: 'true'
          cache-key: coverage-v2-${{ hashFiles('tools/ci/coverage.sh', '.github/workflows/coverage.yml') }}
      - name: Prepare the isolated native player display
        run: sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Test coverage floor enforcement
        run: python3 tools/ci/test-coverage-floors.py
      - name: Install cargo-llvm-cov
        uses: ./.github/actions/cargo-tool
        with:
          name: cargo-llvm-cov
          version: 0.9.1
      - run: rustup component add llvm-tools
      - name: Measure library and headless application integration coverage
        run: bash tools/ci/coverage.sh
      - name: Show the summary
        run: |
          {
            echo '### Library and headless application line coverage'
            echo
            echo '```'
            cat target/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: |
            target/coverage/lcov.info
            target/coverage/summary.txt
            target/coverage/html
          if-no-files-found: error
