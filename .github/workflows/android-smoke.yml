name: Android smoke
on:
  workflow_call:
    inputs:
      prepared-linux-tools:
        type: boolean
        default: false
      lto:
        description: LTO setting for the x86_64 smoke APK
        type: string
        default: 'off'
  workflow_dispatch:
    inputs:
      cold:
        description: Build without restoring apt, NSH, Gradle or Rust caches
        type: boolean
        default: false
      lto:
        description: LTO setting for the x86_64 smoke APK
        type: choice
        options: ['off', thin]
        default: 'off'
      rust-profile:
        description: Rust optimization for the development APK. The uncached options bypass the Cargo cache for a paired comparison.
        type: choice
        options: [pinned, pinned-uncached, opt1-uncached]
        default: pinned

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('android-smoke-pr-{0}', github.event.pull_request.number) || format('android-smoke-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# Launches the app on a tablet and a TV emulator and drives it with remote keys
# (tools/ci/android-smoke.sh): first run, the synthetic playlist, a channel in
# the guide, full screen, multiview, background and resume. Path-filtered and
# selected by the required Validation aggregate.
jobs:
  build:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PATINA_SMOKE_LTO: ${{ inputs.lto || 'off' }}
      PATINA_SMOKE_RUST_PROFILE: ${{ inputs.rust-profile || 'pinned' }}
      PATINA_SMOKE_CODEGEN_UNITS: '16'
      PATINA_SMOKE_DEBUG_ASSERTIONS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 25
        with:
          prerequisites: android-smoke
          cache: ${{ inputs.cold && 'false' || 'true' }}
          cargo-cache: 'false'
      - uses: ./.github/actions/android
        with:
          stage-release: ${{ !inputs.cold && 'true' || 'false' }}
          prepared: ${{ inputs.prepared-linux-tools && !inputs.cold && 'true' || 'false' }}
          abi: x86_64
          cache: ${{ !inputs.cold && 'gradle' || '' }}
      - name: Identify the Android compiler and host libraries
        id: compiler
        shell: bash
        run: |
          case "$PATINA_SMOKE_LTO" in off|thin) ;; *) echo 'Expected off or thin LTO' >&2; exit 2 ;; esac
          case "$PATINA_SMOKE_RUST_PROFILE" in
            pinned|pinned-uncached|opt1-uncached) ;;
            *) echo 'Unknown Android smoke Rust profile' >&2; exit 2 ;;
          esac
          compiler=$(rustc -vV)
          host_compiler=$(cc --version)
          ndk=$(cat "$ANDROID_NDK_HOME/source.properties")
          libraries=$(dpkg-query -W libc6-dev libgtk-4-dev libssl-dev libdbus-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libmpv2)
          identity=$({
            printf '%s\n' "$compiler" "$host_compiler" "$ndk" "$libraries" "$PATINA_SMOKE_LTO" "${ImageOS:-}"
            printf '%s\n' "$PATINA_SMOKE_CODEGEN_UNITS" "$PATINA_SMOKE_DEBUG_ASSERTIONS"
          } | sha256sum | cut -c1-16)
          echo "key=$identity" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: inputs.cold != true && env.PATINA_SMOKE_RUST_PROFILE == 'pinned'
        with:
          key: android-smoke-x86_64-v5-${{ steps.compiler.outputs.key }}-${{ hashFiles('nsh.rev', 'tools/ci/package.Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'crates/iptv-app/nsh.json', 'tools/sync-host.sh', 'tools/ci/locked-cargo.py', 'tools/ci/android-ndk-env.sh', '.cargo/config.toml') }}
          # The checked-in runner lock supplies the identity before NSH generates
          # the workspace. At save time its graph retains Android-only crates.
          add-rust-environment-hash-key: 'false'
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-bin: 'false'
          workspaces: crates/iptv-app/.nsh/rust -> ../../../../target
      # A debug APK for x86_64 emulators whose wizard starts with the mock
      # server's playlist; debug assertions let it reach that private address.
      - name: Build the development APK
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          ABIS: x86_64
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ env.PATINA_SMOKE_CODEGEN_UNITS }}
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: ${{ env.PATINA_SMOKE_DEBUG_ASSERTIONS }}
          CARGO_PROFILE_RELEASE_LTO: ${{ env.PATINA_SMOKE_LTO }}
          IPTV_VALIDATION_APP_ID: com.hantekllc.iptvrs.validation
          IPTV_RS_DEV_PLAYLIST: http://10.0.2.2:8089/iptv/playlist.m3u
          IPTV_CARGO_TIMINGS: '1'
          NSH_VERBOSE: '1'
        run: |
          if [[ "$PATINA_SMOKE_RUST_PROFILE" == opt1-uncached ]]; then
            export CARGO_PROFILE_RELEASE_OPT_LEVEL=1
          fi
          echo "Android smoke Rust profile: $PATINA_SMOKE_RUST_PROFILE"
          bash tools/sync-host.sh
          (cd hosts/android && ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug)
      - name: Rust compilation and linking timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-timings-android-smoke
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-smoke-input
          path: hosts/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
  # The synthetic streams take about a minute to encode and depend only on
  # their script, so they are made beside the APK build, off its critical
  # path, and reused while the script is unchanged.
  streams:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The encoder's arguments are part of the cache identity.
      STREAMS_ARGS: --android-smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The runner image fixes the FFmpeg build a miss installs; segments embed
      # the encoder version, so each image encodes its own once.
      - name: Identify the synthetic streams
        id: streams
        run: |
          recipe=$({ printf '%s\n' "$STREAMS_ARGS"; cat tools/make-hls-fixtures.sh; } | sha256sum | cut -c1-16)
          echo "key=android-smoke-streams-v1-${ImageOS:-unknown}-${ImageVersion:-unversioned}-$recipe" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        if: inputs.cold != true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '3'
        with:
          path: fixtures/hls
          key: ${{ steps.streams.outputs.key }}
      - name: Encode the synthetic streams
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          bash tools/ci/apt-install.sh "$RUNNER_TEMP/patina-apt" false ffmpeg
          bash tools/make-hls-fixtures.sh $STREAMS_ARGS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-smoke-streams
          path: fixtures/hls
          if-no-files-found: error
          retention-days: 3
          # The segments are H.264 already.
          compression-level: 0
      # After the upload, and bounded: a stalled cache service must not hold
      # back the emulator jobs or cancel this one.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cache.outputs.cache-hit != 'true' && inputs.cold != true && github.ref == 'refs/heads/master'
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: fixtures/hls
          key: ${{ steps.streams.outputs.key }}
  smoke:
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.streams.result == 'success' }}
    needs: [build, streams]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - form: tablet
            target: google_apis
            profile: pixel_tablet
          - form: tv
            target: android-tv
            profile: tv_1080p
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-smoke-input
          path: hosts/android/app/build/outputs/apk/debug
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-smoke-streams
          path: fixtures/hls
      # The playlist and guide are centred on the current time, so they are
      # made here, just before the emulator reads them.
      - name: Generate the synthetic playlist and guide
        run: python3 -I tools/make-iptv-fixtures.py --channels 300
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Serve the fixtures
        run: |
          python3 -I tools/ci/test-adb-timeout.py
          mkdir -p target
          nohup python3 tools/mock-server.py 8089 fixtures/hls > target/mock-server.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8089/iptv/playlist.m3u && exit 0
            sleep 0.5
          done
          exit 1
      - name: Smoke test on the ${{ matrix.form }} emulator
        timeout-minutes: 20
        env:
          IPTV_SMOKE_OUT: target/android-smoke
          IPTV_SMOKE_SETTLE: 45
          AVD_TARGET: ${{ matrix.target }}
          AVD_PROFILE: ${{ matrix.profile }}
        run: >-
          python3 tools/ci/android/ci-emulator.py "$AVD_TARGET" "$AVD_PROFILE"
          hosts/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-smoke-${{ matrix.form }}
          path: |
            target/android-smoke
            target/mock-server.log
          if-no-files-found: ignore
