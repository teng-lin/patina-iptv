name: Android smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - form: tablet
            target: google_apis
            profile: pixel_tablet
          - form: tv
            target: android-tv
            profile: tv_1080p
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          avd-name: patina-validation-ci
          api-level: 36
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 180
          ram-size: 4096M
          disk-size: 4096M
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot-load
          script: test -z "$(adb -s emulator-5554 shell pm list packages com.hantekllc.iptvrs.validation)"
      - name: Pack pristine snapshot
        timeout-minutes: 2
        run: |
          cd "$HOME/.android/avd"
          while fuser -s patina-validation-ci.avd/multiinstance.lock; do sleep 1; done
          test -s patina-validation-ci.avd/snapshots/default_boot/snapshot.pb
          tar --sparse -cf - patina-validation-ci.ini patina-validation-ci.avd |
            zstd -1 -T2 -o "$GITHUB_WORKSPACE/avd.tar.zst"
          stat -c 'Compressed snapshot size %s bytes' "$GITHUB_WORKSPACE/avd.tar.zst"
      - name: Upload pristine snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avd-trial-${{ matrix.form }}
          path: avd.tar.zst
          compression-level: 0
          retention-days: 1
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: seed
    strategy:
      fail-fast: false
      matrix:
        include:
          - form: tablet
            target: google_apis
            profile: pixel_tablet
          - form: tv
            target: android-tv
            profile: tv_1080p
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download pristine snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: avd-trial-${{ matrix.form }}
      - name: Unpack snapshot
        run: |
          mkdir -p "$HOME/.android/avd"
          zstd -d -c avd.tar.zst | tar -C "$HOME/.android/avd" -xf -
      - name: Boot emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          avd-name: patina-validation-ci
          api-level: 36
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 180
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot-save
          script: test -z "$(adb -s emulator-5554 shell pm list packages com.hantekllc.iptvrs.validation)"
