name: Android smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: google_apis
            profile: pixel_tablet
          - target: android-tv
            profile: tv_1080p
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare SDK and boot a fresh emulator
        env:
          AVD_TARGET: ${{ matrix.target }}
          AVD_PROFILE: ${{ matrix.profile }}
        run: |
          python3 - <<'PY'
          import os
          import runpy
          import sys
          sys.path.insert(0, "tools/ci/android")
          driver = runpy.run_path("tools/ci/android/ci-emulator.py")
          driver["main"].__globals__["run_smoke"] = lambda *_: 0
          sys.argv = ["ci-emulator.py", os.environ["AVD_TARGET"], os.environ["AVD_PROFILE"], "unused.apk"]
          sys.exit(driver["main"]())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lean-boot-${{ matrix.profile }}
          path: target/android-smoke/emulator.log
          retention-days: 1
