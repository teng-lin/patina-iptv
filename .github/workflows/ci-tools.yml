name: Shared Linux CI tools
on:
  workflow_call:
    inputs:
      android-abis:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 25
        with:
          prerequisites: metadata
          cache: 'false'
      - uses: ./.github/actions/nsh-cli
        if: inputs.android-abis == ''
        with:
          share: 'true'
      - uses: ./.github/actions/android
        if: inputs.android-abis != ''
        with:
          abi: ${{ inputs.android-abis }}
          share: 'true'
