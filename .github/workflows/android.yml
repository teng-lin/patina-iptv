name: Android packages
on:
  workflow_call:
    inputs:
      package:
        description: Package both ARM ABIs instead of compiling them twice
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      package:
        type: boolean
        default: true

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('android-pr-{0}', github.event.pull_request.number) || format('android-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  android-check:
    if: inputs.package != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: android-check-v2-${{ hashFiles('tools/ci/check-android.sh', 'tools/ci/android-ndk-env.sh') }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install the NDK and the Android Rust targets
        run: |
          # Runner images preset ANDROID_NDK_HOME to their own default NDK.
          source tools/ci/android-ndk-env.sh
          sdkmanager "ndk;$IPTV_ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$IPTV_ANDROID_NDK" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi
      - name: Compile the app library for Android
        run: |
          bash tools/ci/check-android.sh aarch64-linux-android
          bash tools/ci/check-android.sh armv7-linux-androideabi
  android:
    if: inputs.package == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: android-v2-${{ hashFiles('tools/sync-host.sh', 'tools/ci/android-ndk-env.sh', '.github/actions/android/action.yml') }}
      - uses: ./.github/actions/android
      - name: Build Android native library
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: ABIS=arm64-v8a,armeabi-v7a bash tools/sync-host.sh
      - uses: ./.github/actions/cargo-tool
        with:
          name: cargo-about
          version: 0.9.3
          features: cli
      - name: Generate and stage Android notices
        run: |
          bash tools/ci/notices.sh
          (cd hosts/android && ./gradlew --no-daemon :app:generateLicenseReport)
          mkdir -p hosts/android/app/build/nsh/assets/notices
          cp -R target/notices/. hosts/android/app/build/nsh/assets/notices/
          cp -R hosts/android/app/build/reports/dependency-license hosts/android/app/build/nsh/assets/notices/gradle
      - name: Build Android APK and bundle
        working-directory: hosts/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug bundleDebug
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify hosts/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify ARM64 and ARMv7 native libraries and notices
        run: |
          python3 tools/ci/check-android-artifacts.py \
            hosts/android/app/build/outputs/apk/debug/app-debug.apk \
            hosts/android/app/build/outputs/bundle/debug/app-debug.aab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug
          path: |
            hosts/android/app/build/outputs/apk/debug/*.apk
            hosts/android/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
