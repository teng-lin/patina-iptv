name: Publish NSH tool releases
on:
  workflow_run:
    workflows: [Validation]
    types: [completed]
    branches: [master]
permissions: {}
concurrency:
  group: publish-nsh-cli-releases
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'teng-lin/patina-iptv' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: patina-nsh-*-release-*
          path: target/nsh-cli-releases
      - name: Generate checksum manifests
        id: manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/nsh-cli-release.py prepare target/nsh-cli-releases
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.manifests.outputs.available == 'true'
        with:
          subject-path: target/nsh-cli-releases/*/nsh-cli.json
      - name: Publish completed NSH CLI builds
        if: steps.manifests.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/nsh-cli-release.py publish target/nsh-cli-releases
