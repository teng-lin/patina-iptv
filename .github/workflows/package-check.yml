name: Package checks
on:
  workflow_call:
    inputs:
      prepared-linux-tools:
        type: boolean
        default: false
      matrix:
        type: string
        default: '{"include":[{"platform":"linux","os":"ubuntu-24.04"},{"platform":"macos","os":"macos-15"}]}'
  workflow_dispatch:
    inputs:
      matrix:
        type: string
        default: '{"include":[{"platform":"linux","os":"ubuntu-24.04"},{"platform":"macos","os":"macos-15"}]}'


concurrency:
  group: ${{ github.event_name == 'pull_request' && format('packages-pr-{0}', github.event.pull_request.number) || format('packages-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  desktop-packages:
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 25
        with:
          cargo-cache: 'false'
          prerequisites: ${{ matrix.platform == 'macos' && 'macos-package' || 'host' }}
          # Linux packaging tools; macOS ignores this list.
          apt-packages: >-
            ruby-dev rpm zstd libarchive-tools patchelf file desktop-file-utils
            libgirepository1.0-dev librsvg2-dev xvfb x11-utils xauth dbus-x11
      - name: Package prerequisites
        shell: bash
        run: |
          python3 tools/ci/version.py
      - uses: ./.github/actions/cargo-tool
        with:
          name: cargo-about
          version: 0.9.3
          features: cli
      - uses: ./.github/actions/nsh-cli
        with:
          prepared: ${{ inputs.prepared-linux-tools && matrix.platform == 'linux' }}
      - uses: ./.github/actions/desktop-cargo-cache
        with:
          platform: ${{ matrix.platform }}
      - name: Linux package installation and smoke tests
        if: matrix.platform == 'linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/desktop-cargo
          IPTV_CARGO_TIMINGS: '1'
        run: |
          sudo gem install fpm -v 1.16.0 --no-document
          bash tools/ci/setup-linux-packaging.sh
          export PATH="$RUNNER_TEMP/linux-packaging:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          bash tools/ci/package-linux.sh
          bash tools/ci/check-linux-packages.sh
      - name: Corresponding source of the system libraries bundled in the AppImage
        if: matrix.platform == 'linux'
        timeout-minutes: 15
        uses: ./.github/actions/linux-sources
      - name: Build, bundle and audit the macOS app
        if: matrix.platform == 'macos'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/desktop-cargo
          IPTV_CARGO_TIMINGS: '1'
        run: bash tools/package-macos.sh
      - name: Check macOS DMGs and smoke-test the transferred package
        if: matrix.platform == 'macos'
        run: |
          bash tools/ci/package-macos.sh
          mkdir -p "$RUNNER_TEMP/signing-download"
          COPYFILE_DISABLE=1 tar -cf "$RUNNER_TEMP/signing-download/signing-input.tar" target/package
          mv target/package target/package-before-transfer
          PACKAGE_PLATFORM=macos python3 tools/ci/unpack-signing-input.py
          IPTV_SIGNING_STAGE=1 bash tools/ci/package-macos.sh
          bash tools/ci/smoke-macos-dmg.sh
          # As in a release: the source of any bundled Homebrew library must be
          # fetchable (normally none: libmpv is the pinned runtime).
          python3 tools/ci/native-sources.py macos target/package/Patina.app \
            "target/native-sources/Patina-$VERSION-macos-native-sources.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rust-timings-desktop-package-${{ matrix.platform }}
          path: target/desktop-cargo/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-packages-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      # Only the manifest: what was fetched from where, for review.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-sources-manifest-${{ matrix.platform }}
          path: target/native-sources/Patina-*-native-sources.json
          if-no-files-found: ${{ matrix.platform == 'linux' && 'error' || 'ignore' }}
