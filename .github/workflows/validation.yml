name: Validation
on:
  pull_request:
  push:
    branches: [master]
  merge_group:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: Full/PR validation, or full candidate validation and unsigned shipping packages
        type: choice
        default: full
        options: [full, pr, candidate]
  workflow_call:
    inputs:
      tier:
        description: Release callers must request release explicitly
        type: string
        default: full
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('validation-pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref == 'refs/heads/master' && inputs.tier != 'release' && 'validation-master') || format('validation-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master' && inputs.tier != 'release') }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      candidate_build: ${{ steps.select.outputs.candidate_build }}
      tier: ${{ steps.select.outputs.tier }}
      host: ${{ steps.select.outputs.host }}
      ios: ${{ steps.select.outputs.ios }}
      credentials: ${{ steps.select.outputs.credentials }}
      helpers_full: ${{ steps.select.outputs.helpers_full }}
      windows: ${{ steps.select.outputs.windows }}
      android: ${{ steps.select.outputs.android }}
      android_package: ${{ steps.select.outputs.android_package }}
      packages: ${{ steps.select.outputs.packages }}
      package_matrix: ${{ steps.select.outputs.package_matrix }}
      windows-package: ${{ steps.select.outputs.windows-package }}
      coverage: ${{ steps.select.outputs.coverage }}
      fuzz: ${{ steps.select.outputs.fuzz }}
      smoke: ${{ steps.select.outputs.smoke }}
      stress: ${{ steps.select.outputs.stress }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select validation for this commit
        id: select
        env:
          EVENT: ${{ github.event_name }}
          TIER: ${{ inputs.tier == 'candidate' && 'release' || inputs.tier || (github.event_name == 'push' && github.ref == 'refs/heads/master' && 'release') || (github.event_name == 'schedule' && 'full') || 'pr' }}
          CANDIDATE_BUILD: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master' && inputs.tier != 'release') || (github.event_name == 'workflow_dispatch' && inputs.tier == 'candidate') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: python3 tools/ci/validation-plan.py plan >> "$GITHUB_OUTPUT"
  helpers:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test tier selection and failure propagation
        run: python3 tools/ci/test-validation-plan.py
      - name: Read the compiler and NSH pins
        if: needs.plan.outputs.helpers_full == 'true'
        id: pins
        run: python3 tools/ci/pins.py >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.plan.outputs.helpers_full == 'true'
        with:
          repository: longbridge/nsh
          ref: ${{ steps.pins.outputs.nsh }}
          path: nsh-source
          persist-credentials: false
      - if: needs.plan.outputs.helpers_full == 'true'
        run: mv nsh-source ../nsh-patina
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: needs.plan.outputs.helpers_full == 'true'
        with:
          toolchain: ${{ steps.pins.outputs.toolchain }}
      - name: Check CI helpers without compiling the application
        if: needs.plan.outputs.helpers_full == 'true'
        run: |
          export IPTV_REAL_CARGO
          IPTV_REAL_CARGO=$(command -v cargo)
          python3 tools/ci/check-package-lock.py
          for script in tools/ci/test-*.py; do python3 "$script"; done
          python3 -m unittest discover -s tools -p test_version.py
          python3 tools/performance/test_journeys.py
          python3 tools/mpv-runtime-ios/test_build.py
          python3 tools/mpv-runtime/test_prepare.py
          python3 tools/mpv-runtime/test_package.py
          python3 -m venv "$RUNNER_TEMP/helper-linters"
          "$RUNNER_TEMP/helper-linters/bin/pip" install ruff==0.11.13 shellcheck-py==0.10.0.1
          "$RUNNER_TEMP/helper-linters/bin/ruff" check tools/
          git ls-files -z '*.sh' | xargs -0 "$RUNNER_TEMP/helper-linters/bin/shellcheck"

  host:
    needs: [plan, helpers]
    if: needs.plan.outputs.host == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      helpers-checked: true
      tier: ${{ needs.plan.outputs.tier == 'pr' && 'pr' || 'full' }}
  ios:
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    uses: ./.github/workflows/ios.yml
  credentials:
    needs: plan
    if: needs.plan.outputs.credentials == 'true'
    uses: ./.github/workflows/credentials.yml
  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    uses: ./.github/workflows/windows.yml
    with:
      tier: ${{ needs.plan.outputs.tier == 'pr' && 'native' || 'full' }}
  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    uses: ./.github/workflows/android.yml
    with:
      package: ${{ needs.plan.outputs.android_package == 'true' }}
  packages:
    needs: plan
    if: needs.plan.outputs.packages == 'true'
    uses: ./.github/workflows/package-check.yml
    with:
      matrix: ${{ needs.plan.outputs.package_matrix }}
  windows-package:
    needs: plan
    if: needs.plan.outputs.windows-package == 'true'
    uses: ./.github/workflows/windows-package-check.yml
  coverage:
    needs: plan
    if: needs.plan.outputs.coverage == 'true'
    uses: ./.github/workflows/coverage.yml
  fuzz:
    needs: plan
    if: needs.plan.outputs.fuzz != '[]'
    uses: ./.github/workflows/fuzz.yml
    with:
      targets: ${{ needs.plan.outputs.fuzz }}
      seconds: ${{ needs.plan.outputs.tier == 'full' && 300 || 30 }}
      save-corpus: ${{ github.ref == 'refs/heads/master' && needs.plan.outputs.tier == 'full' }}
  smoke:
    needs: plan
    if: needs.plan.outputs.smoke == 'true'
    uses: ./.github/workflows/android-smoke.yml
  stress:
    needs: plan
    if: needs.plan.outputs.stress == 'true'
    uses: ./.github/workflows/import-stress.yml
  validation:
    needs: [plan, helpers, host, windows, android, packages, windows-package, coverage, fuzz, smoke, stress, ios, credentials, candidate]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require every selected lane to pass
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/validation-plan.py gate
  # Preserve the current protected contexts during migration. Each alias mirrors
  # the entire aggregate, including Windows and source-only Android compilation.
  protected-contexts:
    needs: validation
    if: always()
    strategy:
      matrix:
        context: ['test (ubuntu-24.04)', 'test (macos-15)', android]
    name: ${{ matrix.context }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.validation.result }}
        run: test "$RESULT" = success
  candidate:
    needs: plan
    if: needs.plan.outputs.candidate_build == 'true'
    uses: ./.github/workflows/unsigned-candidate.yml
    with:
      matrix: '{"include":[{"platform":"android","os":"ubuntu-24.04"},{"platform":"linux","os":"ubuntu-24.04"},{"platform":"macos","os":"macos-15"}]}'
  seal-candidate:
    needs: [plan, validation, candidate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && inputs.tier != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: signing-input-*
          path: target/candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          path: target/candidate
      - name: Bind checks, inputs and unsigned bytes to the candidate commit
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/release-candidate.py seal target/candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: target/candidate
          if-no-files-found: error
          retention-days: 30
