name: Unsigned candidate packages
on:
  workflow_dispatch:
    inputs:
      matrix:
        type: string
        default: '{"include":[{"platform":"android","os":"ubuntu-24.04"},{"platform":"linux","os":"ubuntu-24.04"},{"platform":"macos","os":"macos-15"}]}'
      windows:
        type: boolean
        default: true
  workflow_call:
    inputs:
      desktop-matrix:
        type: string
        required: true
      android:
        type: boolean
        required: true
      windows:
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  dispatch-plan:
    # Reusable callers already have a plan. Keep the manual matrix input.
    if: inputs.matrix != ''
    runs-on: ubuntu-24.04
    outputs:
      desktop: ${{ steps.select.outputs.desktop }}
      android: ${{ steps.select.outputs.android }}
    steps:
      - id: select
        env:
          MATRIX: ${{ inputs.matrix }}
        run: |
          rows=$(jq -ce '.include | if type == "array" then . else error("expected an include array") end' <<< "$MATRIX")
          desktop=$(jq -c '{include: map(select(.platform != "android"))}' <<< "$rows")
          android=$(jq -c 'any(.[]; .platform == "android")' <<< "$rows")
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
  windows-package:
    if: inputs.windows
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          # A trusted unsigned master build can seed the preview cache from fresh output.
          cache: ${{ github.ref == 'refs/heads/master' && 'true' || 'false' }}
          profile: installer
          cache-lookup-only: 'true'
      - name: Set release metadata
        shell: pwsh
        run: python tools/ci/version.py
      - uses: ./.github/actions/cargo-tool
        with:
          name: cargo-about
          version: 0.9.3
          features: cli
      - name: Build Windows installer
        shell: pwsh
        run: ./tools/package-windows.ps1
      - name: Check installation, launch and uninstall
        shell: pwsh
        run: ./tools/ci/check-windows-package.ps1
      - name: Describe the bundled Windows media runtime
        shell: pwsh
        run: |
          $output = "target/media-sbom/Patina-${env:VERSION}-windows-media-runtime-sbom.cdx.json"
          python tools/ci/sbom.py media-runtime target/mpv/components.json $output "$env:VERSION" `
            --platform windows --manifest tools/mpv-runtime/runtime.json
          if ($LASTEXITCODE -ne 0) { throw 'Media runtime SBOM failed.' }
          python tools/ci/build-inventory.py "target/media-sbom/Patina-$env:VERSION-windows-build-environment.json"
          if ($LASTEXITCODE -ne 0) { throw 'Build inventory failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-windows-media-sbom
          path: target/media-sbom/*
          if-no-files-found: error
      # Signed (or not) on a fresh runner that never builds code: windows-sign.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signing-input-windows
          path: dist/Patina-*-windows-x86_64-setup.exe
          if-no-files-found: error
  android-native:
    needs: dispatch-plan
    if: ${{ !cancelled() && (inputs.android || needs.dispatch-plan.outputs.android == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 25
        with:
          cache: 'false'
          prerequisites: android
          apt-cache: 'true'
          policy-tool: ${{ matrix.abi == 'arm64-v8a' && 'true' || 'false' }}
      - uses: ./.github/actions/android
        with:
          abi: ${{ matrix.abi }}
      - name: Build and stage the Android native library
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          ABIS: ${{ matrix.abi }}
        run: |
          bash tools/sync-host.sh --release
          mv hosts/android/app/build/nsh target/android-native
          git rev-parse HEAD > target/android-native/commit.txt
      # Generate notices where NSH wrote the locked runner workspace.
      - uses: ./.github/actions/cargo-tool
        if: matrix.abi == 'arm64-v8a'
        with:
          name: cargo-about
          version: 0.9.3
          features: cli
      - name: Generate Rust and NSH notices
        if: matrix.abi == 'arm64-v8a'
        run: |
          bash tools/ci/notices.sh
          test -s target/notices/runner-components.json
          mv target/notices target/android-native/notices
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-native-${{ matrix.abi }}
          path: target/android-native/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 7
  android-package:
    needs: android-native
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 25
        with:
          cache: 'false'
          prerequisites: metadata
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            hosts/android/**/*.gradle.kts
            hosts/android/gradle.properties
            hosts/android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android packaging tools
        run: |
          source tools/ci/android-ndk-env.sh
          sdkmanager "platforms;android-36" "build-tools;35.0.1" "ndk;$IPTV_ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$IPTV_ANDROID_NDK" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: android-native-*
          path: target/android-native-inputs
      - name: Set release metadata
        run: python3 tools/ci/version.py
      - name: Assemble and check the unsigned Android APK and AAB
        run: |
          python3 tools/ci/merge-android-native.py target/android-native-inputs
          bash tools/ci/prepare-android.sh target/android-native-inputs/android-native-arm64-v8a/notices
          tar -cf target/signing-input.tar target/android-unsigned
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signing-input-android
          path: target/signing-input.tar
          if-no-files-found: error
          overwrite: true
  package:
    needs: dispatch-plan
    if: ${{ !cancelled() && fromJSON(inputs.desktop-matrix || needs.dispatch-plan.outputs.desktop || '{"include":[]}').include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.desktop-matrix || needs.dispatch-plan.outputs.desktop || '{"include":[]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 25
        with:
          cache: 'false'
          prerequisites: ${{ matrix.platform == 'macos' && 'macos-package' || 'host' }}
          # Keep the app build fresh while reusing Ubuntu package downloads.
          apt-cache: ${{ matrix.platform == 'linux' && 'true' || 'false' }}
          # Linux packaging tools.
          apt-packages: >-
            ${{ matrix.platform == 'linux' && 'ruby-dev rpm zstd libarchive-tools patchelf file desktop-file-utils
            libgirepository1.0-dev librsvg2-dev xvfb x11-utils xauth dbus-x11' || '' }}
      - uses: ./.github/actions/cargo-tool
        with:
          name: cargo-about
          version: 0.9.3
          features: cli
      - name: Set release metadata
        shell: bash
        run: |
          python3 tools/ci/version.py
          echo "NSH=$(cd ../nsh-patina && pwd)/target/release/nsh" >> "$GITHUB_ENV"
      - uses: ./.github/actions/nsh-cli
      - uses: ./.github/actions/desktop-cargo-cache
        if: matrix.platform == 'macos' && github.ref == 'refs/heads/master'
        with:
          platform: macos
          lookup-only: 'true'
      - name: Linux packages
        if: matrix.platform == 'linux'
        run: |
          sudo gem install fpm -v 1.16.0 --no-document
          bash tools/ci/setup-linux-packaging.sh
          export PATH="$RUNNER_TEMP/linux-packaging:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1 CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          bash tools/ci/package-linux.sh
          bash tools/ci/check-linux-packages.sh
      # The AppImage's libmpv (with FFmpeg) is the pinned runtime, fetched by
      # hash from its dependency release, which retains its exact sources
      # (tools/mpv-runtime-unix). GTK and the host libraries libmpv uses are
      # Ubuntu's: publish the exact source packages they were built from. A
      # source that cannot be fetched or does not match its checksum fails the
      # release.
      - name: Corresponding source of the system libraries bundled in the AppImage
        if: matrix.platform == 'linux'
        timeout-minutes: 15
        uses: ./.github/actions/linux-sources
      # libmpv is the pinned macOS runtime, fetched and verified by hash.
      - name: Build, bundle and audit the unsigned macOS app
        if: matrix.platform == 'macos'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/desktop-cargo
          IPTV_CARGO_TIMINGS: '1'
        run: bash tools/package-macos.sh
      - name: Check and smoke-test the unsigned macOS DMG
        if: matrix.platform == 'macos'
        run: bash tools/ci/package-macos.sh
      # Homebrew libraries the app may still link beside the pinned runtime
      # (normally none, and then there is no archive): publish the sources
      # named by the formulae of the installed versions.
      - name: Corresponding source of Homebrew libraries bundled in the macOS app
        if: matrix.platform == 'macos'
        run: |
          python3 tools/ci/native-sources.py macos target/package/Patina.app \
            "target/native-sources/Patina-$VERSION-macos-native-sources.tar"
      - name: Build iOS app without signing credentials
        if: matrix.platform == 'ios'
        run: bash tools/ci/prepare-ios.sh
      - name: Describe the bundled media runtime
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            linux) inventory=target/Patina.AppDir/usr/bin/notices/mpv-runtime/components.json ;;
            macos) inventory=target/package/Patina.app/Contents/Resources/notices/mpv-runtime/components.json ;;
          esac
          python3 tools/ci/sbom.py media-runtime "$inventory" \
            "target/media-sbom/Patina-$VERSION-$PLATFORM-media-runtime-sbom.cdx.json" "$VERSION" \
            --platform "$PLATFORM" --manifest "tools/mpv-runtime-unix/runtime-$PLATFORM.json"
          python3 tools/ci/build-inventory.py "target/media-sbom/Patina-$VERSION-$PLATFORM-build-environment.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        with:
          name: packages-${{ matrix.platform }}-media-sbom
          path: target/media-sbom/*
          if-no-files-found: error
      - name: Preserve prepared signing inputs
        if: matrix.platform != 'linux'
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            macos) input=target/package ;;
            ios) input=target/ios ;;
          esac
          COPYFILE_DISABLE=1 tar -cf target/signing-input.tar "$input"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform != 'linux'
        with:
          name: signing-input-${{ matrix.platform }}
          path: target/signing-input.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'linux'
        with:
          name: packages-linux
          path: dist/*
          if-no-files-found: error
      # Released beside the packages; the signing jobs never see these files.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        with:
          name: packages-${{ matrix.platform }}-native-sources
          path: target/native-sources/Patina-*-native-sources.*
          # The AppImage always bundles Ubuntu libraries; the macOS app only
          # the pinned runtime unless it links a Homebrew library.
          if-no-files-found: ${{ matrix.platform == 'linux' && 'error' || 'ignore' }}
          # The members are compressed archives already.
          compression-level: 0
  sbom:
    # No signing material and no publication rights: only the dependency graph.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 25
        with:
          cache: 'false'
          prerequisites: metadata
      - name: Set release metadata
        run: python3 tools/ci/version.py
      - uses: ./.github/actions/cargo-tool
        with:
          name: cargo-cyclonedx
          version: 0.5.10
      - name: Write the CycloneDX SBOM for the locked Rust graph
        run: python3 tools/ci/sbom.py "dist/Patina-$VERSION-sbom.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-sbom
          path: dist/*
          if-no-files-found: error
