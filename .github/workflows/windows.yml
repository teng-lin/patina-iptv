name: Windows
on:
  workflow_call:
    inputs:
      tier:
        type: string
        default: full
  workflow_dispatch:
    inputs:
      tier:
        type: choice
        default: full
        options: [full, native]

permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('windows-pr-{0}', github.event.pull_request.number) || format('windows-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          cache-on-failure: 'true'
      - name: Verify dependency packaging helpers
        shell: pwsh
        run: |
          python tools/ci/test-check-parity.py
          if ($LASTEXITCODE -ne 0) { throw 'Shared Rust validation parity checks failed.' }
          python tools/ci/test-check-plan.py
          if ($LASTEXITCODE -ne 0) { throw 'Shared Rust plan runner tests failed.' }
          python tools/ci/test-ci-cache.py
          if ($LASTEXITCODE -ne 0) { throw 'CI tool cache identity checks failed.' }
          python tools/mpv-runtime/test_prepare.py
          if ($LASTEXITCODE -ne 0) { throw 'Source preparation tests failed.' }
          python tools/mpv-runtime/test_package.py
          if ($LASTEXITCODE -ne 0) { throw 'Runtime packaging tests failed.' }
      - name: Test and build Windows app
        shell: pwsh
        env:
          IPTV_TEST_WAIT_SCALE: '2'
        run: |
          ./tools/build-windows.ps1 -Check -Tier "${{ inputs.tier }}"
          python tools/ci/check-windows-icon.py target/debug/iptv-app.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows executable icon check failed.' }
          python tools/ci/check-package-lock.py
          if ($LASTEXITCODE -ne 0) { throw 'Generated runner lock is stale.' }
          python tools/ci/test-package-lock.py
          if ($LASTEXITCODE -ne 0) { throw 'Runner lock regression tests failed.' }
      - name: Rust compilation and linking timings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rust-timings-windows
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7
