name: Production credential persistence
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  isolated-broker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          policy-tool: 'false'
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 25
        with:
          cache-key: production-credentials-v1
          apt-packages: gnome-keyring dbus-x11 libglib2.0-bin
      - name: Verify production key creation and reopen with disposable credentials
        run: python3 tools/ci/isolated-credentials.py
