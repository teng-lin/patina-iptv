name: Import stress
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 25
        with:
          cache-on-failure: 'true'
          cache-key: stress-v2-${{ hashFiles('tools/ci/import-stress.sh') }}
      - name: Full catalog and million-programme EPG memory budgets
        run: bash tools/ci/import-stress.sh
