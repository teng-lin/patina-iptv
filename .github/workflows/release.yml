name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to package (all requires Apple signing secrets; a rehearsal takes android-desktop only)
        type: choice
        default: android-desktop
        options: [android-desktop, android, desktop, all]
      rehearsal:
        description: Rehearsal (no release credentials; throwaway Android key, tag and draft release)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
      signing_matrix: ${{ steps.platforms.outputs.signing_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Refuses, before anything is built: a manual run outside master that is
      # not a rehearsal, and a rehearsal of anything but Android and desktop
      # (iOS cannot be signed without release credentials).
      - id: platforms
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PLATFORMS: ${{ inputs.platforms || 'android-desktop' }}
          REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal }}
        run: python3 tools/ci/release-plan.py
  tests:
    uses: ./.github/workflows/ci.yml
  windows-tests:
    if: github.event_name == 'push' || inputs.platforms != 'android'
    uses: ./.github/workflows/windows.yml
  windows-package:
    if: github.event_name == 'push' || inputs.platforms != 'android'
    needs: [plan, tests, windows-tests]
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          cache: 'false'
      - name: Set release metadata
        shell: pwsh
        run: python tools/ci/version.py
      - name: Install dependency notice generator
        shell: pwsh
        run: cargo install cargo-about --version 0.9.3 --features cli --locked
      - name: Build Windows installer
        shell: pwsh
        run: ./tools/package-windows.ps1
      - name: Check installation, launch and uninstall
        shell: pwsh
        run: ./tools/ci/check-windows-package.ps1
      - name: Describe the bundled Windows media runtime
        shell: pwsh
        run: |
          $output = "target/media-sbom/Patina-${env:VERSION}-windows-media-runtime-sbom.cdx.json"
          python tools/ci/sbom.py media-runtime target/mpv/components.json $output "$env:VERSION" `
            --platform windows --manifest tools/mpv-runtime/runtime.json
          if ($LASTEXITCODE -ne 0) { throw 'Media runtime SBOM failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-windows-media-sbom
          path: target/media-sbom/*.cdx.json
          if-no-files-found: error
      # Signed (or not) on a fresh runner that never builds code: windows-sign.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signing-input-windows
          path: dist/Patina-*-windows-x86_64-setup.exe
          if-no-files-found: error
  # Authenticode through Azure Trusted Signing (Artifact Signing) when its
  # credentials exist; otherwise the installer is released as an unsigned
  # preview and the release notes say so (docs/release.md, "Platform signing").
  #
  # A rehearsal signs in `release-rehearsal`, an environment that holds no
  # secrets and may run from any branch; everything else signs in `release`,
  # whose protection rules decide which refs may reach the release credentials.
  # Every `secrets.` expression of the two signing jobs is also forced empty in
  # a rehearsal, so it is an unsigned preview there
  # (tools/ci/test-release-workflow.py checks both).
  windows-sign:
    needs: [windows-package]
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal && 'release-rehearsal' || 'release' }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signing-input-windows
          path: dist
      # Only whether each secret is set reaches this step, never its value.
      - name: Check the signing configuration
        id: config
        shell: bash
        env:
          TENANT: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.AZURE_TENANT_ID != '' }}
          CLIENT: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.AZURE_CLIENT_ID != '' }}
          CLIENT_SECRET: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.AZURE_CLIENT_SECRET != '' }}
          ENDPOINT: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.AZURE_SIGNING_ENDPOINT != '' }}
          ACCOUNT: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.AZURE_SIGNING_ACCOUNT != '' }}
          PROFILE: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.AZURE_CERTIFICATE_PROFILE != '' }}
        run: |
          set -euo pipefail
          test "$(find dist -type f | wc -l)" -eq 1
          states="$TENANT $CLIENT $CLIENT_SECRET $ENDPOINT $ACCOUNT $PROFILE"
          case "$states" in
            *false*true*|*true*false*)
              echo "Windows signing is partly configured ($states): set all six AZURE_* secrets or none" >&2
              exit 1 ;;
            *true*) echo "sign=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Authenticode credentials absent: the installer is released as an unsigned preview"
              echo "sign=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Sign the installer
        if: steps.config.outputs.sign == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.AZURE_TENANT_ID || '' }}
          azure-client-id: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.AZURE_CLIENT_ID || '' }}
          azure-client-secret: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.AZURE_CLIENT_SECRET || '' }}
          endpoint: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.AZURE_SIGNING_ENDPOINT || '' }}
          signing-account-name: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.AZURE_SIGNING_ACCOUNT || '' }}
          certificate-profile-name: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.AZURE_CERTIFICATE_PROFILE || '' }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify the Authenticode signature and timestamp
        if: steps.config.outputs.sign == 'true'
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem dist -Filter *.exe) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name): signature $($signature.Status)" }
            if (-not $signature.TimeStamperCertificate) { throw "$($file.Name): no timestamp" }
            Write-Host "$($file.Name): $($signature.SignerCertificate.Subject)"
          }
      - name: Record the signing state for the release notes
        shell: bash
        run: |
          python tools/ci/publish-release.py signing windows \
            "${{ steps.config.outputs.sign == 'true' && 'signed' || 'unsigned' }}" target/signing-status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signing-status-windows
          path: target/signing-status/windows.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-windows
          path: dist/Patina-*-windows-x86_64-setup.exe
          if-no-files-found: error
  package:
    needs: [plan, tests]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - name: Install dependency notice generator
        run: |
          cargo install cargo-about --version 0.9.3 --features cli --locked
      - name: Set release metadata
        shell: bash
        run: |
          python3 tools/ci/version.py
          echo "NSH=$(cd ../nsh && pwd)/target/release/nsh" >> "$GITHUB_ENV"
      - uses: ./.github/actions/nsh-cli
        if: matrix.platform != 'android'
        with:
          cache: 'false'
      - uses: ./.github/actions/android
        if: matrix.platform == 'android'
        with:
          cache: ''
      - name: Build Android native library
        if: matrix.platform == 'android'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: bash tools/sync-host.sh --release
      - name: Linux packages
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y ruby-dev rpm zstd libarchive-tools patchelf file desktop-file-utils \
            libgirepository1.0-dev librsvg2-dev xvfb x11-utils xauth dbus-x11
          sudo gem install fpm -v 1.16.0 --no-document
          bash tools/ci/setup-linux-packaging.sh
          export PATH="$RUNNER_TEMP/linux-packaging:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1 CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          bash tools/ci/package-linux.sh
          bash tools/ci/check-linux-packages.sh
      # The AppImage's libmpv (with FFmpeg) is the pinned runtime, fetched by
      # hash from its dependency release, which retains its exact sources
      # (tools/mpv-runtime-unix). GTK and the host libraries libmpv uses are
      # Ubuntu's: publish the exact source packages they were built from. A
      # source that cannot be fetched or does not match its checksum fails the
      # release.
      - name: Corresponding source of the system libraries bundled in the AppImage
        if: matrix.platform == 'linux'
        run: |
          bash tools/ci/enable-deb-src.sh
          python3 tools/ci/native-sources.py linux target/Patina.AppDir \
            "target/native-sources/Patina-$VERSION-linux-native-sources.tar"
      - name: Prepare unsigned Android artifacts
        if: matrix.platform == 'android'
        run: bash tools/ci/prepare-android.sh
      # libmpv is the pinned macOS runtime, fetched and verified by hash.
      - name: Build macOS app without signing credentials
        if: matrix.platform == 'macos'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          bash tools/package-macos.sh
          bash tools/ci/package-macos.sh
      # Homebrew libraries the app may still link beside the pinned runtime
      # (normally none, and then there is no archive): publish the sources
      # named by the formulae of the installed versions.
      - name: Corresponding source of Homebrew libraries bundled in the macOS app
        if: matrix.platform == 'macos'
        run: |
          python3 tools/ci/native-sources.py macos target/package/Patina.app \
            "target/native-sources/Patina-$VERSION-macos-native-sources.tar"
      - name: Build iOS app without signing credentials
        if: matrix.platform == 'ios'
        run: bash tools/ci/prepare-ios.sh
      - name: Describe the bundled media runtime
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            linux) inventory=target/Patina.AppDir/usr/bin/notices/mpv-runtime/components.json ;;
            macos) inventory=target/package/Patina.app/Contents/Resources/notices/mpv-runtime/components.json ;;
          esac
          python3 tools/ci/sbom.py media-runtime "$inventory" \
            "target/media-sbom/Patina-$VERSION-$PLATFORM-media-runtime-sbom.cdx.json" "$VERSION" \
            --platform "$PLATFORM" --manifest "tools/mpv-runtime-unix/runtime-$PLATFORM.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        with:
          name: packages-${{ matrix.platform }}-media-sbom
          path: target/media-sbom/*.cdx.json
          if-no-files-found: error
      - name: Preserve prepared signing inputs
        if: matrix.platform != 'linux'
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            android) input=target/android-unsigned ;;
            macos) input=target/package ;;
            ios) input=target/ios ;;
          esac
          COPYFILE_DISABLE=1 tar -cf target/signing-input.tar "$input"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform != 'linux'
        with:
          name: signing-input-${{ matrix.platform }}
          path: target/signing-input.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'linux'
        with:
          name: packages-linux
          path: dist/*
          if-no-files-found: error
      # Released beside the packages; the signing jobs never see these files.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        with:
          name: packages-${{ matrix.platform }}-native-sources
          path: target/native-sources/Patina-*-native-sources.*
          # The AppImage always bundles Ubuntu libraries; the macOS app only
          # the pinned runtime unless it links a Homebrew library.
          if-no-files-found: ${{ matrix.platform == 'linux' && 'error' || 'ignore' }}
          # The members are compressed archives already.
          compression-level: 0
  sbom:
    # No signing material and no publication rights: only the dependency graph.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - name: Set release metadata
        run: python3 tools/ci/version.py
      - name: Write the CycloneDX SBOM for the locked Rust graph
        run: |
          cargo install cargo-cyclonedx --version 0.5.10 --locked
          python3 tools/ci/sbom.py "dist/Patina-$VERSION-sbom.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-sbom
          path: dist/*
          if-no-files-found: error
  # The environment and the secrets follow the same rule as in windows-sign: a
  # rehearsal gets `release-rehearsal` and no release credential. Its Android
  # packages are signed with a key made for the run (tools/ci/sign-android.sh)
  # and its macOS image is the ad hoc signed preview.
  sign:
    needs: [plan, tests, package]
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal && 'release-rehearsal' || 'release' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.signing_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # A fresh runner with trusted scripts, no build cache or dependency build.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signing-input-${{ matrix.platform }}
          path: ${{ runner.temp }}/signing-download
      - name: Unpack only prepared artifacts
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 tools/ci/unpack-signing-input.py
          python3 tools/ci/version.py
      # keytool, jarsigner and apksigner run on the JDK the Android build uses
      # (.github/actions/android), not on whichever one the runner image defaults to.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        if: matrix.platform == 'android'
      - name: Install Android signing tools
        if: matrix.platform == 'android'
        run: sdkmanager "build-tools;35.0.1"
      # A release fails here without the production keystore; only a rehearsal
      # signs with a throwaway key, and only when no release credential arrived.
      - name: Android tablet and TV
        if: matrix.platform == 'android'
        env:
          REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal }}
          KEYSTORE: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          STORE_PASSWORD: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.ANDROID_STORE_PASSWORD || '' }}
          KEY_PASSWORD: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.ANDROID_KEY_PASSWORD || '' }}
          KEY_ALIAS: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.ANDROID_KEY_ALIAS || '' }}
        run: bash tools/ci/sign-android.sh
      - name: macOS disk image
        env:
          IPTV_SIGNING_STAGE: '1'
          MACOS_CERTIFICATE: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.MACOS_CERTIFICATE_BASE64 || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          MACOS_SIGN_IDENTITY: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.MACOS_SIGN_IDENTITY || '' }}
          APPLE_ID: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_PASSWORD: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.APPLE_APP_PASSWORD || '' }}
        if: matrix.platform == 'macos'
        run: bash tools/ci/package-macos.sh
      - name: Signed iPad package
        if: matrix.platform == 'ios'
        env:
          IOS_CERTIFICATE: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.IOS_CERTIFICATE_BASE64 || '' }}
          IOS_CERTIFICATE_PASSWORD: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.IOS_CERTIFICATE_PASSWORD || '' }}
          IOS_PROFILE: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.IOS_PROFILE_BASE64 || '' }}
          IOS_SIGN_IDENTITY: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.IOS_SIGN_IDENTITY || '' }}
        run: bash tools/ci/package-ios.sh
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/macos.p12" "$RUNNER_TEMP/notarize.zip" "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/rehearsal-android.p12" "$RUNNER_TEMP/ios-profile.plist" "$RUNNER_TEMP/ios.entitlements" "$RUNNER_TEMP/ios.p12" "$RUNNER_TEMP/ios.mobileprovision"
          if [ "${{ matrix.platform }}" = macos ]; then
            if [ -e "$RUNNER_TEMP/macos-release.keychain-db" ]; then
              security delete-keychain "$RUNNER_TEMP/macos-release.keychain-db"
            fi
            test ! -e "$RUNNER_TEMP/macos-release.keychain-db"
          fi
          if [ "${{ matrix.platform }}" = ios ]; then
            if [ -e "$RUNNER_TEMP/release.keychain-db" ]; then
              security delete-keychain "$RUNNER_TEMP/release.keychain-db"
            fi
            test ! -e "$RUNNER_TEMP/release.keychain-db"
          fi
      - name: Smoke signed macOS package after credential cleanup
        if: matrix.platform == 'macos'
        run: bash tools/ci/smoke-macos-dmg.sh
      # Whether the certificate is set, never its value. With it, the step
      # above only succeeds once the app and image are notarized and stapled.
      - name: Record the signing state for the release notes
        if: matrix.platform == 'macos'
        env:
          SIGNED: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rehearsal) && secrets.MACOS_CERTIFICATE_BASE64 != '' }}
        run: |
          python3 tools/ci/publish-release.py signing macos \
            "$([ "$SIGNED" = true ] && echo signed || echo unsigned)" target/signing-status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'macos'
        with:
          name: signing-status-macos
          path: target/signing-status/macos.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.rehearsal)
    needs: [tests, package, sign, windows-package, windows-sign, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Build provenance: a short-lived Sigstore certificate bound to this
      # workflow run signs the attestations. Only this job can request one.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal && format('rehearsal-{0}', github.run_id) || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create throwaway tag for rehearsal
        if: github.event_name == 'workflow_dispatch' && inputs.rehearsal
        run: python3 tools/ci/rehearsal.py create "$TAG" "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      # A public release is never written to again (tools/ci/publish-release.py).
      - name: Refuse to replace a public release, then write SHA256SUMS
        run: python3 tools/ci/publish-release.py checksums dist "$TAG"
      # One attestation names every released file by its SHA-256 digest; a
      # second covers SHA256SUMS itself, so the checksum file is signed too.
      # Verify with `gh attestation verify` (docs/release.md).
      - name: Attest the provenance of every released file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest the provenance of SHA256SUMS
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: signing-status-*
          merge-multiple: true
          path: signing-status
      # Unsigned macOS/Windows packages are announced as previews.
      - name: Release notes from the signing records
        run: python3 tools/ci/publish-release.py notes signing-status release-notes.md
      - name: Upload to a draft and publish it once
        run: |
          rehearsal_flag=""
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal }}" = "true" ]; then
            rehearsal_flag="--rehearsal"
          fi
          python3 tools/ci/publish-release.py publish $rehearsal_flag dist "$TAG" release-notes.md
      - name: Clean up rehearsal release and tag
        if: always() && github.event_name == 'workflow_dispatch' && inputs.rehearsal
        run: python3 tools/ci/rehearsal.py cleanup "$TAG" "$GITHUB_SHA"
