name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to package (all requires Apple signing secrets)
        type: choice
        default: android-desktop
        options: [android-desktop, android, desktop, all]
      rehearsal:
        description: Rehearsal mode (draft release and cleanup on throwaway tag)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
      signing_matrix: ${{ steps.platforms.outputs.signing_matrix }}
    steps:
      - name: Refuse manual releases outside master
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master' && !inputs.rehearsal
        run: exit 1
      - id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms || 'android-desktop' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          selection = os.environ["PLATFORMS"]
          platforms = []
          if selection in ("android", "android-desktop", "all"):
              platforms.append({"platform": "android", "os": "ubuntu-24.04"})
          if selection in ("desktop", "android-desktop", "all"):
              platforms += [
                  {"platform": "linux", "os": "ubuntu-24.04"},
                  {"platform": "macos", "os": "macos-15"},
              ]
          if selection == "all":
              platforms.append({"platform": "ios", "os": "macos-15"})
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": platforms}) + "\n")
              out.write("signing_matrix=" + json.dumps({"include": [p for p in platforms if p["platform"] != "linux"]}) + "\n")
          PY
  tests:
    uses: ./.github/workflows/ci.yml
  windows-tests:
    if: github.event_name == 'push' || inputs.platforms != 'android'
    uses: ./.github/workflows/windows.yml
  windows-package:
    if: github.event_name == 'push' || inputs.platforms != 'android'
    needs: [plan, tests, windows-tests]
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          cache: 'false'
      - name: Set release metadata
        shell: pwsh
        run: python tools/ci/version.py
      - name: Install dependency notice generator
        shell: pwsh
        run: cargo install cargo-about --version 0.9.3 --features cli --locked
      - name: Build Windows installer
        shell: pwsh
        run: ./tools/package-windows.ps1
      - name: Check installation, launch and uninstall
        shell: pwsh
        run: ./tools/ci/check-windows-package.ps1
      # Signed (or not) on a fresh runner that never builds code: windows-sign.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signing-input-windows
          path: dist/Patina-*-windows-x86_64-setup.exe
          if-no-files-found: error
  # Authenticode through Azure Trusted Signing (Artifact Signing) when its
  # credentials exist; otherwise the installer is released as an unsigned
  # preview and the release notes say so (docs/release.md, "Platform signing").
  windows-sign:
    needs: [windows-package]
    environment: release
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signing-input-windows
          path: dist
      # Only whether each secret is set reaches this step, never its value.
      - name: Check the signing configuration
        id: config
        shell: bash
        env:
          TENANT: ${{ secrets.AZURE_TENANT_ID != '' }}
          CLIENT: ${{ secrets.AZURE_CLIENT_ID != '' }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT != '' }}
          ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT != '' }}
          PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE != '' }}
        run: |
          set -euo pipefail
          test "$(find dist -type f | wc -l)" -eq 1
          states="$TENANT $CLIENT $CLIENT_SECRET $ENDPOINT $ACCOUNT $PROFILE"
          case "$states" in
            *false*true*|*true*false*)
              echo "Windows signing is partly configured ($states): set all six AZURE_* secrets or none" >&2
              exit 1 ;;
            *true*) echo "sign=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Authenticode credentials absent: the installer is released as an unsigned preview"
              echo "sign=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Sign the installer
        if: steps.config.outputs.sign == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify the Authenticode signature and timestamp
        if: steps.config.outputs.sign == 'true'
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem dist -Filter *.exe) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name): signature $($signature.Status)" }
            if (-not $signature.TimeStamperCertificate) { throw "$($file.Name): no timestamp" }
            Write-Host "$($file.Name): $($signature.SignerCertificate.Subject)"
          }
      - name: Record the signing state for the release notes
        shell: bash
        run: |
          python tools/ci/publish-release.py signing windows \
            "${{ steps.config.outputs.sign == 'true' && 'signed' || 'unsigned' }}" target/signing-status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signing-status-windows
          path: target/signing-status/windows.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-windows
          path: dist/Patina-*-windows-x86_64-setup.exe
          if-no-files-found: error
  package:
    needs: [plan, tests]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - name: Install dependency notice generator
        run: |
          cargo install cargo-about --version 0.9.3 --features cli --locked
      - name: Set release metadata
        shell: bash
        run: |
          python3 tools/ci/version.py
          echo "NSH=$(cd ../nsh && pwd)/target/release/nsh" >> "$GITHUB_ENV"
      - uses: ./.github/actions/nsh-cli
        if: matrix.platform != 'android'
        with:
          cache: 'false'
      - uses: ./.github/actions/android
        if: matrix.platform == 'android'
        with:
          cache: ''
      - name: Build Android native library
        if: matrix.platform == 'android'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: bash tools/sync-host.sh --release
      - name: Linux packages
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y ruby-dev rpm zstd libarchive-tools patchelf file desktop-file-utils \
            libgirepository1.0-dev librsvg2-dev xvfb x11-utils xauth dbus-x11
          sudo gem install fpm -v 1.16.0 --no-document
          bash tools/ci/setup-linux-packaging.sh
          export PATH="$RUNNER_TEMP/linux-packaging:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1 CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          bash tools/ci/package-linux.sh
          bash tools/ci/check-linux-packages.sh
      # The AppImage's libmpv (with FFmpeg) is the pinned runtime, fetched by
      # hash from its dependency release, which retains its exact sources
      # (tools/mpv-runtime-unix). GTK and the host libraries libmpv uses are
      # Ubuntu's: publish the exact source packages they were built from. A
      # source that cannot be fetched or does not match its checksum fails the
      # release.
      - name: Corresponding source of the system libraries bundled in the AppImage
        if: matrix.platform == 'linux'
        run: |
          bash tools/ci/enable-deb-src.sh
          python3 tools/ci/native-sources.py linux target/Patina.AppDir \
            "target/native-sources/Patina-$VERSION-linux-native-sources.tar"
      - name: Prepare unsigned Android artifacts
        if: matrix.platform == 'android'
        run: bash tools/ci/prepare-android.sh
      # libmpv is the pinned macOS runtime, fetched and verified by hash.
      - name: Build macOS app without signing credentials
        if: matrix.platform == 'macos'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          bash tools/package-macos.sh
          bash tools/ci/package-macos.sh
      # Homebrew libraries the app may still link beside the pinned runtime
      # (normally none, and then there is no archive): publish the sources
      # named by the formulae of the installed versions.
      - name: Corresponding source of Homebrew libraries bundled in the macOS app
        if: matrix.platform == 'macos'
        run: |
          python3 tools/ci/native-sources.py macos target/package/Patina.app \
            "target/native-sources/Patina-$VERSION-macos-native-sources.tar"
      - name: Build iOS app without signing credentials
        if: matrix.platform == 'ios'
        run: bash tools/ci/prepare-ios.sh
      - name: Preserve prepared signing inputs
        if: matrix.platform != 'linux'
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            android) input=target/android-unsigned ;;
            macos) input=target/package ;;
            ios) input=target/ios ;;
          esac
          COPYFILE_DISABLE=1 tar -cf target/signing-input.tar "$input"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform != 'linux'
        with:
          name: signing-input-${{ matrix.platform }}
          path: target/signing-input.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'linux'
        with:
          name: packages-linux
          path: dist/*
          if-no-files-found: error
      # Released beside the packages; the signing jobs never see these files.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        with:
          name: packages-${{ matrix.platform }}-native-sources
          path: target/native-sources/Patina-*-native-sources.*
          # The AppImage always bundles Ubuntu libraries; the macOS app only
          # the pinned runtime unless it links a Homebrew library.
          if-no-files-found: ${{ matrix.platform == 'linux' && 'error' || 'ignore' }}
          # The members are compressed archives already.
          compression-level: 0
  sbom:
    # No signing material and no publication rights: only the dependency graph.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - name: Set release metadata
        run: python3 tools/ci/version.py
      - name: Write CycloneDX SBOMs for the locked Rust graph and bundled media runtime
        run: |
          cargo install cargo-cyclonedx --version 0.5.10 --locked
          python3 tools/ci/sbom.py "dist/Patina-$VERSION-sbom.cdx.json"
          python3 tools/ci/sbom.py media-runtime tools/mpv-runtime/sources.lock.json "dist/Patina-$VERSION-media-runtime-sbom.cdx.json" "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-sbom
          path: dist/*
          if-no-files-found: error
  sign:
    needs: [plan, tests, package]
    environment: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.signing_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # A fresh runner with trusted scripts, no build cache or dependency build.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signing-input-${{ matrix.platform }}
          path: ${{ runner.temp }}/signing-download
      - name: Unpack only prepared artifacts
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 tools/ci/unpack-signing-input.py
          python3 tools/ci/version.py
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        if: matrix.platform == 'android'
      - name: Install Android signing tools
        if: matrix.platform == 'android'
        run: sdkmanager "build-tools;35.0.1"
      - name: Android tablet and TV
        if: matrix.platform == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          bash tools/ci/package-android.sh
      - name: macOS disk image
        env:
          IPTV_SIGNING_STAGE: '1'
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        if: matrix.platform == 'macos'
        run: bash tools/ci/package-macos.sh
      - name: Signed iPad package
        if: matrix.platform == 'ios'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_SIGN_IDENTITY: ${{ secrets.IOS_SIGN_IDENTITY }}
        run: bash tools/ci/package-ios.sh
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/macos.p12" "$RUNNER_TEMP/notarize.zip" "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/ios-profile.plist" "$RUNNER_TEMP/ios.entitlements" "$RUNNER_TEMP/ios.p12" "$RUNNER_TEMP/ios.mobileprovision"
          if [ "${{ matrix.platform }}" = macos ]; then
            if [ -e "$RUNNER_TEMP/macos-release.keychain-db" ]; then
              security delete-keychain "$RUNNER_TEMP/macos-release.keychain-db"
            fi
            test ! -e "$RUNNER_TEMP/macos-release.keychain-db"
          fi
          if [ "${{ matrix.platform }}" = ios ]; then
            if [ -e "$RUNNER_TEMP/release.keychain-db" ]; then
              security delete-keychain "$RUNNER_TEMP/release.keychain-db"
            fi
            test ! -e "$RUNNER_TEMP/release.keychain-db"
          fi
      - name: Smoke signed macOS package after credential cleanup
        if: matrix.platform == 'macos'
        run: bash tools/ci/smoke-macos-dmg.sh
      # Whether the certificate is set, never its value. With it, the step
      # above only succeeds once the app and image are notarized and stapled.
      - name: Record the signing state for the release notes
        if: matrix.platform == 'macos'
        env:
          SIGNED: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' }}
        run: |
          python3 tools/ci/publish-release.py signing macos \
            "$([ "$SIGNED" = true ] && echo signed || echo unsigned)" target/signing-status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'macos'
        with:
          name: signing-status-macos
          path: target/signing-status/macos.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.rehearsal)
    needs: [tests, package, sign, windows-package, windows-sign, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Build provenance: a short-lived Sigstore certificate bound to this
      # workflow run signs the attestations. Only this job can request one.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('rehearsal-{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create throwaway tag for rehearsal
        if: github.event_name == 'workflow_dispatch' && inputs.rehearsal
        run: |
          git tag "$TAG"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      # A public release is never written to again (tools/ci/publish-release.py).
      - name: Refuse to replace a public release, then write SHA256SUMS
        run: python3 tools/ci/publish-release.py checksums dist "$TAG"
      # One attestation names every released file by its SHA-256 digest; a
      # second covers SHA256SUMS itself, so the checksum file is signed too.
      # Verify with `gh attestation verify` (docs/release.md).
      - name: Attest the provenance of every released file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest the provenance of SHA256SUMS
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: signing-status-*
          merge-multiple: true
          path: signing-status
      # Unsigned macOS/Windows packages are announced as previews.
      - name: Release notes from the signing records
        run: python3 tools/ci/publish-release.py notes signing-status release-notes.md
      - name: Upload to a draft and publish it once
        run: |
          rehearsal_flag=""
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal }}" = "true" ]; then
            rehearsal_flag="--rehearsal"
          fi
          python3 tools/ci/publish-release.py publish $rehearsal_flag dist "$TAG" release-notes.md
      - name: Clean up rehearsal release and tag
        if: always() && github.event_name == 'workflow_dispatch' && inputs.rehearsal
        run: |
          gh release delete "$TAG" --yes || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" --delete "$TAG" || true
