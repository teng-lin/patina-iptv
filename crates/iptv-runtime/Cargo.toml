[package]
name = "iptv-runtime"
description = "Native application services and owned runtime for Patina IPTV."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["native"]
# What only native hosts have: the iptv-net adapter, thread-based executors
# and the native-only services (recording, backup files, the credential
# store, staged probes). Without it the crate builds for wasm32.
native = ["dep:iptv-net", "dep:getrandom", "tokio/rt", "tokio/rt-multi-thread", "tokio/time"]
# Synthetic latency controls, absent from production packages.
test-support = []

[dependencies]
iptv-core.workspace = true
iptv-library.workspace = true
iptv-guide.workspace = true
iptv-epg.workspace = true
iptv-providers.workspace = true
iptv-import.workspace = true
iptv-net = { workspace = true, optional = true }
iptv-store-sqlite.workspace = true
iptv-search.workspace = true
iptv-settings.workspace = true
getrandom = { version = "0.4", optional = true }
futures-channel = "0.3"
tokio = { version = "1", default-features = false, features = ["sync"] }
log.workspace = true
serde_json.workspace = true
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
subtle = "2.6"
zeroize = "1.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# The integration harness drives native owners (threads, Tokio, SQLCipher).
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["native"]
