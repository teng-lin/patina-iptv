[package]
name = "iptv-runtime"
description = "Native application services and owned runtime for Patina IPTV."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Synthetic latency controls, absent from production packages.
test-support = []

[dependencies]
iptv-core.workspace = true
iptv-library.workspace = true
iptv-guide.workspace = true
iptv-epg.workspace = true
iptv-providers.workspace = true
iptv-import.workspace = true
iptv-net.workspace = true
iptv-store-sqlite.workspace = true
iptv-search.workspace = true
iptv-settings.workspace = true
getrandom = "0.4"
futures-channel = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync"] }
log.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
