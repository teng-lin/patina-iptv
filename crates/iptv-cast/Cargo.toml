[package]
name = "iptv-cast"
description = "Native casting sender and receiver discovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["googlecast", "avahi", "airplay"]
airplay = [
    "dep:mdns-sd", "dep:num-bigint", "dep:plist", "dep:ring",
    "dep:sha2", "dep:srp", "dep:subtle", "dep:zeroize",
]
googlecast = [
    "dep:mdns-sd", "dep:prost", "dep:x509-cert", "dep:webpki",
    "dep:serde_json", "dep:tokio-rustls",
]
avahi = ["googlecast", "dep:dbus"]
test-support = ["googlecast"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
mdns-sd = { version = "0.21", optional = true }
mime = "0.3"
num-bigint = { version = "0.4", optional = true }
# The event reader lets us limit decoded object expansion before constructing a Value.
plist = { version = "~1.10.4", default-features = false, features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"], optional = true }
prost = { version = "0.14", optional = true }
ring = { version = "0.17", optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
srp = { version = "0.6", optional = true }
subtle = { version = "2.6", optional = true }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
tokio-util = { version = "0.7", features = ["rt"] }
url.workspace = true
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, optional = true }
x509-cert = { version = "0.2", default-features = false, optional = true }
zeroize = { version = "1.9", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rpassword = "7"

[[example]]
name = "airplay_probe"
required-features = ["airplay"]

[lints]
workspace = true
