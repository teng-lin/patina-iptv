[package]
name = "iptv-web"
description = "Web application layer of iptv-rs for browser TV runtimes (Samsung Tizen): the portable core in WebAssembly behind a JavaScript host, with the network as a sans-IO Fetch adapter. No NSH."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["bridge"]
# The Live TV bridge (the frozen JavaScript host's application: `app`,
# `store` and the `command` export). An application on the real runtime
# takes only the adapters and their delivery exports, without it.
# Its messages are package files (`i18n/<tag>.tsv`, hosts/tizen/build.sh),
# read through `package` when a language is first shown.
bridge = ["dep:iptv-nav", "dep:iptv-presentation", "iptv-presentation/external-catalog"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
futures-channel = "0.3"
iptv-core.workspace = true
iptv-epg.workspace = true
iptv-guide.workspace = true
iptv-import.workspace = true
iptv-nav = { workspace = true, optional = true }
iptv-presentation = { workspace = true, optional = true }
iptv-providers.workspace = true
iptv-search.workspace = true
log.workspace = true
serde_json.workspace = true
url.workspace = true

[lints]
workspace = true
