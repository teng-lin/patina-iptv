[package]
name = "iptv-net"
description = "Native network adapter of iptv-rs: performs iptv-providers HttpRequests with reqwest (rustls + ring, webpki roots; no OpenSSL) and implements iptv_import::Fetch. Native only (tokio); not part of the portable core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Exposes the HLS and DASH manifest rewriters to the fuzz crate
# (`playback::fuzzing`). Nothing else enables it.
fuzzing = []

[dependencies]
iptv-providers.workspace = true
iptv-import.workspace = true
log.workspace = true
url.workspace = true
# No default features: no OpenSSL, no aws-lc (C/cmake), no system proxy.
# TLS is a preconfigured rustls config (ring provider + webpki roots), so it
# cross-compiles for Android with only the NDK clang (for ring).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip", "deflate", "charset", "cookies"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "net", "rt", "sync", "time", "macros"] }

cookie_store = { version = "0.22", default-features = false }
getrandom = "0.4"
quick-xml = "0.42"
subtle = "2.6"

[target.'cfg(unix)'.dependencies]
# Only the `O_NONBLOCK` constant, for opening a picked file (`file.rs`).
libc = "0.2"

[dev-dependencies]
# test-util: a paused clock for the retry wait (no real sleeping in tests).
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
iptv-epg.workspace = true

[lints]
workspace = true
