[package]
name = "iptv-app"
description = "The NSH shell of iptv-rs: TV + tablet screens rendering iptv-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Synthetic fixture transport and key injection; never enabled in packages.
test-support = ["iptv-runtime/test-support"]

[dependencies]
iptv-runtime.workspace = true
iptv-library.workspace = true
base64 = "0.22"
sys-locale = "0.3.2"
iptv-core.workspace = true
iptv-player-mpv.workspace = true
iptv-nav.workspace = true
iptv-guide.workspace = true
iptv-epg.workspace = true
iptv-providers.workspace = true
iptv-import.workspace = true
iptv-net.workspace = true
iptv-search.workspace = true
iptv-settings.workspace = true
futures-channel = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync"] }
nsh-core.workspace = true
nsh-base.workspace = true
env_logger.workspace = true
log.workspace = true
serde_json.workspace = true
zeroize = "1.8"
getrandom = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(unix)'.dependencies]
# localtime_r for the device's UTC offset (time.rs).
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4.1", features = ["crypto-rust"] }
nsh-platform-linux.workspace = true
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios.workspace = true

[dev-dependencies]
iptv-store-sqlite.workspace = true
rusqlite.workspace = true
# Headless runs of the app: what a press reaches (tests/app/pointer.rs).
nsh-engine.workspace = true
nsh-testing.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "app"
path = "tests/app/main.rs"
required-features = ["test-support"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }


[target.'cfg(windows)'.dependencies]
nsh-platform-windows.workspace = true
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
embed-resource = "3.0"
