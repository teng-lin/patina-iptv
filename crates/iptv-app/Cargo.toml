[package]
name = "iptv-app"
description = "The NSH front end for Patina IPTV."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The desktop entry point only wires the library; its tests live in the library
# and integration harnesses, so it needs no separate empty libtest executable.
[[bin]]
name = "iptv-app"
path = "src/main.rs"
test = false

[features]
# Synthetic fixture transport and key injection; never enabled in packages.
test-support = ["iptv-runtime/test-support"]
# A browser package (hosts/tizen-nsh) keeps its data out of the module,
# whose size is its launch time: the interface languages' messages are
# read per language from the package, the fonts are the page's (its
# `fonts` option) and the splash is the package's `assets/banner.png`.
# For the browser host only; native builds embed them.
browser-package = ["iptv-presentation/external-catalog"]

[dependencies]
iptv-runtime.workspace = true
iptv-library.workspace = true
base64 = "0.22"
sys-locale = "0.3.2"
iptv-core.workspace = true
iptv-presentation.workspace = true
iptv-player-mpv.workspace = true
iptv-nav.workspace = true
iptv-guide.workspace = true
iptv-epg.workspace = true
iptv-providers.workspace = true
iptv-import.workspace = true
iptv-search.workspace = true
iptv-settings.workspace = true
futures-channel = "0.3"
tokio = { version = "1", default-features = false, features = ["sync"] }
nsh-tv = { path = "../../vendor/nsh-tv" }
nsh-core.workspace = true
nsh-base.workspace = true
env_logger.workspace = true
log.workspace = true
serde_json.workspace = true
zeroize = "1.8"

# The native hosts (host/native): the runtime's native services, iptv-net,
# threads and Tokio.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
iptv-runtime = { workspace = true, features = ["native"] }
iptv-net.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync"] }
getrandom = "0.4"

# The browser host (host/web): iptv-web's adapters.
[target.'cfg(target_family = "wasm")'.dependencies]
# The adapters only, without the Live TV bridge.
iptv-web = { path = "../iptv-web", default-features = false }
# The browser store's memory files and their persistence (host/web/store.rs).
iptv-store-sqlite.workspace = true
# Artwork headers (NSH's own probe is native only).
imagesize = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(unix)'.dependencies]
# localtime_r for the device's UTC offset (time.rs).
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
iptv-cast.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4.1", features = ["crypto-rust"] }
# The logind and portal sleep inhibitors while recording (host/native/keep_awake.rs).
dbus = "0.9"
# Direct Cargo builds need SVG rendering for the desktop controls.
nsh-platform-linux = { workspace = true, features = ["svg"] }
tempfile = "3"
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { workspace = true, features = ["svg"] }

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { workspace = true, features = ["svg"] }
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "UIView", "UIResponder", "UIAccessibility", "UIApplication", "UIScene"] }
# Native backup-exclusion values used by platform_data on device and simulator.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSString", "NSURL", "NSValue", "NSNotification", "NSOperation", "NSObject", "block2"] }

[dev-dependencies]
iptv-store-sqlite.workspace = true
rusqlite.workspace = true
# Headless runs of the app: what a press reaches (tests/app/pointer.rs).
nsh-engine.workspace = true
nsh-testing.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "app"
path = "tests/app/main.rs"
required-features = ["test-support"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }


[target.'cfg(windows)'.dependencies]
# The Windows app builds without NSH's defaults and needs SVG rendering for its icons.
nsh-platform-windows = { workspace = true, features = ["svg"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
embed-resource = "3.0"
# The bundle id for the iOS simulator's entitlements (build.rs).
serde_json.workspace = true

[[example]]
name = "guide_window_preview"
path = "examples/guide_window_preview.rs"
required-features = ["test-support"]

[[example]]
name = "library_preview"
path = "examples/library_preview.rs"
required-features = ["test-support"]
