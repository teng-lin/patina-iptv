[package]
name = "iptv-core"
description = "UI-independent core of iptv-rs: guide model and remote/touch focus. No NSH dependency; must build for wasm32."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# The interface languages' messages outside the module: read per language
# from the host (`i18n::set_catalog_reader`), for a browser package, whose
# module size is its launch time. Off by default: native builds embed them.
external-catalog = []

[dependencies]
zeroize = "1.8"

[lints]
workspace = true
