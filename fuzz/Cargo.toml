[package]
name = "iptv-import-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
iptv-import = { path = "../crates/iptv-import" }
iptv-providers = { path = "../crates/iptv-providers" }
iptv-epg = { path = "../crates/iptv-epg" }
# The manifest rewriters are private to the playback relay; this feature
# exposes them to the `manifests` target only.
iptv-net = { path = "../crates/iptv-net", features = ["fuzzing"] }

[[bin]]
name = "m3u"
path = "fuzz_targets/m3u.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xmltv"
path = "fuzz_targets/xmltv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xtream"
path = "fuzz_targets/xtream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stalker"
path = "fuzz_targets/stalker.rs"
test = false
doc = false
bench = false

[[bin]]
name = "catchup"
path = "fuzz_targets/catchup.rs"
test = false
doc = false
bench = false

[[bin]]
name = "backup_manifest"
path = "fuzz_targets/backup_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gzip"
path = "fuzz_targets/gzip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hls"
path = "fuzz_targets/hls.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dash"
path = "fuzz_targets/dash.rs"
test = false
