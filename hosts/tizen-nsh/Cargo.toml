# The Tizen runner of Patina's NSH interface: `iptv-app` on the external
# NSH platform for Samsung TVs (nsh-platform-tizen), built by build.sh for
# Tizen 5.5's WebAssembly (MVP + sign-extension + mutable globals, a
# rebuilt std on the pinned nightly).
#
# Its own workspace, as the TV build has its own toolchain, profile and
# lockfile: the root workspace's checks never build it, and the platform's
# git source stays out of the root lock and its audit.
[workspace]
resolver = "3"

[package]
name = "patina-tizen"
description = "Patina's NSH interface on Samsung Tizen TVs: iptv-app linked into nsh-platform-tizen's module."
version = "0.1.13"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
# `browser-package`: the messages, fonts and splash are package files
# (build.sh stages them), not module data.
iptv-app = { path = "../../crates/iptv-app", features = ["browser-package"] }
nsh-core = { path = "../../../nsh-patina/crates/nsh-core" }
# The platform, pinned by revision (docs/patina-integration.md there says
# what a host supplies).
nsh-platform-tizen = { git = "https://github.com/teng-lin/nsh-platform-tizen", rev = "7570f3322b8c0a8ecda9a315c7d488894b90bfd5" }

# The platform takes NSH from its git repository at the commit Patina pins
# (nsh.rev); Patina takes it from the checkout beside the repository. One
# NSH in the module: the git source is the checkout.
[patch."https://github.com/teng-lin/nsh"]
nsh-core = { path = "../../../nsh-patina/crates/nsh-core" }
nsh-engine = { path = "../../../nsh-patina/crates/nsh-engine" }
nsh-base = { path = "../../../nsh-patina/crates/nsh-base" }

# The TV build (build.sh uses it; every size and timing on the TV comes
# from it). opt-level z: a third less code than 3 and a third less
# compile time on a 2020 set, and the one whose compiled module caches.
# The measurements ("Module size and launch"):
# https://github.com/teng-lin/patina-iptv/blob/5db8843cd3b4f82a4b7821e7ef2b52a74c73c3d4/docs/plans/2026-11-21-browser-tv-architecture.md
[profile.tizen]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
